<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SmallStock Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,500..850&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: forest-green navigation rail, sticky top bar (species switch + global search), warm off-white
   workspace. Colour carries meaning only: green good, amber attention, red urgent, blue info, gold identity. */
:root{
  --bg:#F7F6F1; --surface:#FFFFFF; --surface-2:#F2F1EB; --stone:#E9E5DA; --sage-l:#E8EEE9; --sage:#7C9184;
  --ink:#17211D; --ink-2:#2E3A34; --muted:#5D6A62; --line:#E1DDD2; --line-2:#ECE9E1;
  --forest:#173F35; --forest-2:#1F5446; --on-forest:#FFFFFF; --link:#1F5446;
  --gold:#C9A227; --gold-l:#F4EBC9; --gold-ink:#6B5410;
  --tag:#E6C65A; --tag-ink:#271F03; --tag-edge:#C9A227;
  --ok:#2F7D4A; --ok-bg:#E5F0E8; --warn:#D99A24; --warn-ink:#8A5A0B; --warn-bg:#FBF1DC; --bad:#C7463A; --bad-bg:#FAE6E3; --info:#46789B; --info-bg:#E4EDF4;
  --male:#46789B; --female:#A2506F; --cast:#7A8580;
  --goat:#A0733F; --sheep:#5F7A93; --spc:var(--forest);
  --side:#173F35; --side-ink:#CFE0D7; --side-hi:#21503F; --side-line:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(23,33,29,.05),0 2px 8px rgba(23,33,29,.04);
  --shadow-2:0 8px 28px rgba(23,33,29,.12);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#171E1A; --surface-2:#1C2420; --stone:#26302A; --sage-l:#1F2B25; --sage:#8FA397;
  --ink:#E7ECE8; --ink-2:#CBD4CE; --muted:#97A39B; --line:#2A342E; --line-2:#222B26;
  --forest:#2C7560; --forest-2:#358A71; --on-forest:#FFFFFF; --link:#7FC4A6;
  --gold:#D4B04A; --gold-l:#332B12; --gold-ink:#E7CF84;
  --tag:#DDBE55; --tag-ink:#1E1802; --tag-edge:#B8932A;
  --ok:#6CC08A; --ok-bg:#1A2D21; --warn:#E3AB45; --warn-ink:#EBC071; --warn-bg:#33280F; --bad:#E5806F; --bad-bg:#3A1E1A; --info:#86B4D4; --info-bg:#1A2A36;
  --male:#86B4D4; --female:#D791AE; --cast:#A5AEA9;
  --goat:#C9995F; --sheep:#93AFC6;
  --side:#0D1411; --side-ink:#BFD0C6; --side-hi:#1B2C24; --side-line:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171E1A; --surface-2:#1C2420; --stone:#26302A; --sage-l:#1F2B25; --sage:#8FA397;
  --ink:#E7ECE8; --ink-2:#CBD4CE; --muted:#97A39B; --line:#2A342E; --line-2:#222B26;
  --forest:#2C7560; --forest-2:#358A71; --on-forest:#FFFFFF; --link:#7FC4A6;
  --gold:#D4B04A; --gold-l:#332B12; --gold-ink:#E7CF84;
  --tag:#DDBE55; --tag-ink:#1E1802; --tag-edge:#B8932A;
  --ok:#6CC08A; --ok-bg:#1A2D21; --warn:#E3AB45; --warn-ink:#EBC071; --warn-bg:#33280F; --bad:#E5806F; --bad-bg:#3A1E1A; --info:#86B4D4; --info-bg:#1A2A36;
  --male:#86B4D4; --female:#D791AE; --cast:#A5AEA9;
  --goat:#C9995F; --sheep:#93AFC6;
  --side:#0D1411; --side-ink:#BFD0C6; --side-hi:#1B2C24; --side-line:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
body[data-sp="goat"]{--spc:var(--goat)} body[data-sp="sheep"]{--spc:var(--sheep)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:28px;font-weight:800;font-stretch:92%;line-height:1.1}
h2{font-size:17px;font-weight:750;font-stretch:96%}
h3{font-size:15px;font-weight:700}
.tnum,.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;padding:18px 12px;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-stretch:85%;font-size:17px;font-weight:800;color:#fff;letter-spacing:.02em;line-height:1.05}
.brand b i{font-style:normal;color:var(--gold);font-size:11px;letter-spacing:.14em;margin-left:4px;vertical-align:2px;border:1px solid rgba(201,162,39,.55);padding:1px 4px;border-radius:4px}
.brand span{display:block;font-size:12px;opacity:.7;margin-top:3px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navgrp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;padding:14px 10px 6px;font-weight:700}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--side-ink);text-align:left;font-weight:550;font-size:14px}
.navbtn svg{width:18px;height:18px;flex:none;opacity:.85}
.navbtn:hover{background:var(--side-hi);color:#fff}
.navbtn.on{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.navbtn .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;opacity:.75;padding:12px 8px 0;line-height:1.4;border-top:1px solid var(--side-line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6CC08A;margin-right:6px;vertical-align:1px}
.dot.local{background:var(--gold)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.content{padding:24px 28px 120px;max-width:1400px;width:100%}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.pagehead .sub{color:var(--muted);margin-top:4px}
.sp-mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--spc) 14%,var(--surface));color:var(--spc);flex:none}
.sp-mark svg{width:22px;height:22px}
.tabbar,.fab-wrap{display:none}

/* species switch */
.spseg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.spseg button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spseg button svg{width:18px;height:18px}
.spseg button:hover{color:var(--ink)}
.spseg button.on{background:var(--ink);color:var(--bg)}


/* global search */
.gsearch{position:relative;flex:1 1 280px;min-width:0;max-width:560px;margin-left:auto}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px 9px 38px;min-height:40px}
.gsearch input:focus{outline:none;border-color:var(--forest-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--forest-2) 16%,transparent)}
.gsearch>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.gsearch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface-2)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2);max-height:70vh;overflow:auto;z-index:60}
.gres[hidden]{display:none!important}
.gitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.gitem:last-child{border-bottom:0}
.gitem:hover,.gitem.on{background:var(--surface-2)}
.gitem .gl1{font-weight:650}.gitem .gl2{font-size:12.5px;color:var(--muted)}
.topbtn{min-height:40px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.split.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.mt{margin-top:16px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0;position:relative;text-align:left}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--sage)}
.kpi .label{font-size:12px;color:var(--muted);font-weight:650;letter-spacing:.01em}
.kpi .val{font-family:var(--f-display);font-stretch:88%;font-size:30px;font-weight:800;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad{border-color:var(--line)}.kpi.bad .val{color:var(--bad)}
.kpi.warn .val{color:var(--ink)}

.kpi.lite{box-shadow:none;background:var(--surface-2)}

/* overview header */
.overview{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:18px}
.overview .eyebrow{color:var(--spc)}
.overview h1{font-size:34px}
.overview p{margin:4px 0 0;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;background:var(--forest);color:var(--on-forest);padding:8px 14px;border-radius:8px;font-weight:650;font-size:13.5px;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--forest-2)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--sage)}
.btn.gold{background:var(--gold);color:#201800}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}
.btn.link{background:none;border:0;color:var(--link);padding:0;min-height:0;font-weight:650}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* ear tag chip (identity) */
.etag{display:inline-flex;align-items:center;gap:6px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-mono);font-weight:600;font-size:12.5px;padding:2px 9px 2px 7px;border-radius:5px 5px 10px 10px;border-bottom:2px solid var(--tag-edge);white-space:nowrap;line-height:1.35}
.etag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--tag-edge)}
.etag.lg{font-size:18px;padding:5px 14px 5px 10px}
.etag.ref{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
/* custom labels */
.lchips{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.lchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--stone);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.lchip.gold{background:var(--gold-l);color:var(--gold-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
.lchip.bad,.lchip.info,.lchip.ok,.lchip.warn{background:var(--stone);color:var(--ink-2)}
.lchip.sel{cursor:pointer;border:0}
.lchip.sel.on{background:var(--ink);color:var(--bg);box-shadow:none}
/* pills / status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line-2)}
.pill.ok{background:var(--surface-2);color:var(--ink-2)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.info{background:var(--surface-2);color:var(--ink-2)}
.pill.gold{background:var(--surface-2);color:var(--ink-2)}
.stat{font-size:12.5px;color:var(--muted)}
.sex{font-weight:800}.sex.F{color:var(--female)}.sex.M{color:var(--male)}.sex.C{color:var(--cast)}
.spdot{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.spdot svg{width:16px;height:16px}
.spdot svg{color:var(--muted)}

/* FAMACHA */
.fam{display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fam .sw{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);flex:none}
.fam b{font-weight:750;font-size:14px}
.fam span{font-size:12px;color:var(--muted)}
.fam span.fam-alert{color:var(--bad);font-weight:600}
.fam.lg .sw{width:26px;height:26px;border-radius:5px}.fam.lg b{font-family:var(--f-display);font-size:30px;font-weight:800}.fam.lg span{font-size:13px}
.famcard{margin:0;max-width:560px}
.fc-strip{display:grid;grid-template-columns:repeat(5,1fr);height:34px;border:1px solid var(--ink-2);border-radius:6px;overflow:hidden}
.fc-strip span{display:block;border-right:1px solid rgba(23,33,29,.35);position:relative}
.fc-strip span:last-child{border-right:0}
.fc-strip span.on{box-shadow:inset 0 0 0 3px var(--ink)}
.fc-labels{display:grid;grid-template-columns:repeat(5,1fr);margin-top:8px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.25}
.fc-labels b{display:block;font-family:var(--f-display);font-size:20px;font-weight:800;color:var(--ink);letter-spacing:0;margin-bottom:2px}
.fc-labels div.on{color:var(--ink)}
.fampick{display:inline-flex;align-items:center;gap:0;border:1px solid var(--ink-2);border-radius:6px;overflow:hidden}
.fampick button{width:30px;height:28px;border:0;border-right:1px solid rgba(23,33,29,.3);font-size:12px;font-weight:800;padding:0;color:#2a1a1c;border-radius:0}
.fampick button.dk{color:#fff}
.fampick button.on{box-shadow:inset 0 0 0 3px var(--ink);}
.fampick button.clr{background:var(--surface);color:var(--muted);border-right:0;width:26px}
.famdist{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line-2)}
.famdist span{display:block;height:100%}

/* tables */
.tablewrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th.sort{cursor:pointer;user-select:none}table.t th.sort:hover{color:var(--ink)}
table.t th .arr{font-size:10px;margin-left:3px}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t tr.selr td{background:color-mix(in srgb,var(--gold) 9%,var(--surface))}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
table.t td.nw{white-space:nowrap}
table.t .stick{position:sticky;left:0;background:inherit;z-index:1}
table.herd td{background:var(--surface)}
table.herd th.stick{z-index:2;background:var(--surface-2)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.chk{width:17px;height:17px;accent-color:var(--forest);vertical-align:middle}
.batchbar{position:sticky;top:70px;z-index:20;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:10px;margin-bottom:12px;box-shadow:var(--shadow-2)}
.batchbar .btn.ghost{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.28)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px;min-width:0}
input.search,select.sel{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;min-height:38px}
select.sel{width:auto;max-width:100%}
.filterchip{display:inline-flex;gap:8px;align-items:center;background:var(--info-bg);color:var(--info);font-weight:650;font-size:13px;padding:5px 6px 5px 12px;border-radius:8px}
.colpick{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px}
.colpick label{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px;border:1px solid var(--line-2);border-radius:7px;cursor:pointer}

/* alerts (hierarchy) */
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);align-items:center}
.al:last-child{border-bottom:0}
.al .bar{align-self:stretch;border-radius:2px;background:var(--line)}
.al.bad .bar{background:var(--bad)}.al.warn .bar{background:var(--warn)}.al.ok .bar{background:var(--ok)}.al.info .bar{background:var(--line)}
.al b{font-weight:650}.al.info b{font-weight:550}
.al .d{font-size:12.5px;color:var(--muted)}
.al.bad{background:linear-gradient(90deg,var(--bad-bg),transparent 70%);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:6px}

/* attention required */
.attn{border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.attn-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.attn-h h2{color:var(--bad)}.attn-h>svg{width:20px;height:20px;color:var(--bad)}
.attn-h .cnt{background:var(--bad);color:#fff;font-weight:800;border-radius:6px;padding:1px 8px;font-size:13px}
.attn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.acard{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:5px;min-width:0}
.acard.warn{border-left-color:var(--warn)}
.acard:hover{background:var(--surface-2)}
.acard .ah{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
.acard.warn .ah{color:var(--warn-ink)}
.acard .al2{font-size:12.5px;color:var(--muted)}

/* upcoming births */
.births{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.bcard:hover{border-color:var(--sage);box-shadow:var(--shadow)}
.cd{width:64px;text-align:center;border-radius:8px;padding:7px 4px 6px;background:var(--surface-2);color:var(--ink);flex:none}
.cd b{display:block;font-family:var(--f-display);font-stretch:88%;font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.cd span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:3px;color:var(--muted)}
.cd.near b{color:var(--bad)}
.cd.hot{background:var(--bad)}.cd.hot b,.cd.hot span{color:#fff}
.cd.sm{width:58px;padding:6px 3px 5px}.cd.sm b{font-size:24px}
.blist{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 18px;gap:14px;align-items:center;padding:10px 4px;border-top:1px solid var(--line-2);cursor:pointer}
.brow:first-child{border-top:0}
.brow:hover{background:var(--surface-2)}
.brow .bmain{min-width:0}.brow .bmain b{font-weight:650}
.brow .bdue{text-align:right;white-space:nowrap}.brow .bdue b{display:block;font-weight:650}.brow .bdue span{font-size:12px;color:var(--muted)}
.brow .chev svg{width:16px;height:16px;color:var(--muted)}
.bnext{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding:18px 20px;border-radius:10px;background:var(--forest);color:var(--on-forest);cursor:pointer;margin-bottom:6px}
.bnext .cd{width:96px;background:rgba(255,255,255,.1)}.bnext .cd b{font-size:46px;color:#fff}.bnext .cd span{color:rgba(255,255,255,.75)}
.bnext .cd.hot{background:var(--bad)}
.bnext .eyebrow{color:var(--gold)}
.bnext h2{color:#fff;font-size:22px;margin:0}
.bnext p{margin:6px 0 0;opacity:.82;font-size:13.5px}
.bnext .etag{font-size:15px}
/* week timeline */
.week{display:grid;grid-template-columns:repeat(9,minmax(96px,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);min-width:820px}
.wcol{border-right:1px solid var(--line-2);min-height:120px;display:flex;flex-direction:column}
.wcol:last-child{border-right:0}
.wcol .wh{padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.wcol .wh b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.wcol .wh span{font-size:12px;color:var(--muted)}
.wcol.today .wh{background:var(--ink);color:var(--bg)}.wcol.today .wh span{color:inherit;opacity:.75}
.wcol.over .wh{background:var(--bad);color:#fff}.wcol.over .wh span{color:inherit;opacity:.85}
.wcol .wb{padding:8px;display:flex;flex-direction:column;gap:6px}
.witem{border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12px;background:var(--surface)}
.witem:hover{border-color:var(--sage)}
.witem .etag{font-size:11px}
.witem div{margin-top:3px;color:var(--muted)}
.wnone{font-size:12px;color:var(--muted);opacity:.6;padding:2px}

/* actions & quick actions */
.actl{display:flex;flex-direction:column;gap:6px}
.act{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.act:hover{border-color:var(--sage);background:var(--surface-2)}
.act .n{font-family:var(--f-display);font-size:22px;font-weight:850;text-align:center;border-radius:7px;padding:3px 0;font-variant-numeric:tabular-nums}
.act .n{background:var(--surface-2);color:var(--ink)}.act.bad .n{background:var(--bad);color:#fff}
.act .go{color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:650;font-size:13px;text-align:left;min-height:74px}
.qa button:hover{border-color:var(--forest-2);background:var(--sage-l)}
.qa button svg{width:20px;height:20px;color:var(--forest-2)}

/* species cards */
.spcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.spcard{border:1px solid var(--line);border-top:3px solid var(--spc);border-radius:10px;padding:14px 16px;background:var(--surface);cursor:pointer;text-align:left}
.spcard:hover{box-shadow:var(--shadow)}
.spcard .row{gap:8px}
.spcard dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:12px 0 0;font-size:13px}
.spcard dt{color:var(--muted)}.spcard dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.spcard.goat{--spc:var(--goat)}.spcard.sheep{--spc:var(--sheep)}

/* activity */
.feed-l{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.fi:last-child{border-bottom:0}
.fi:hover b{text-decoration:underline}
.fi .ic{width:28px;height:28px;border-radius:7px;background:var(--sage-l);color:var(--forest-2);display:grid;place-items:center}
.fi .ic svg{width:15px;height:15px}
.fi b{font-weight:550}

/* profile */
.phead{display:grid;grid-template-columns:116px minmax(0,1fr);gap:20px;align-items:start}
.photo{width:116px;height:116px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.idgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:2px 18px;margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px}
.idgrid .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.idgrid .v{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.preg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;border-radius:10px;padding:16px 18px;background:var(--info-bg);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);margin-top:16px}
.preg.attention{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.preg.urgent,.preg.today,.preg.open,.preg.overdue{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.preg .ph{font-family:var(--f-display);font-weight:850;letter-spacing:.12em;font-size:13px;color:var(--info)}
.preg.attention .ph{color:var(--warn-ink)}.preg.urgent .ph,.preg.today .ph,.preg.open .ph,.preg.overdue .ph{color:var(--bad)}
.preg .pd{font-size:18px;font-weight:700;margin-top:2px}
.preg .ps{font-size:13px;color:var(--muted);margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 18px}
.fact{padding:8px 0;border-bottom:1px dashed var(--line-2);min-width:0}
.fact .k{font-size:11.5px;color:var(--muted);font-weight:650}
.fact .v{font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 16px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13.5px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}

/* pedigree */
.ped{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));grid-template-rows:auto;grid-auto-rows:minmax(52px,auto);gap:6px 14px;min-width:640px}
.pslot{display:flex;align-items:center;min-width:0}.pslot .pbox{width:100%}
.pbox{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-height:48px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;min-width:0}
.pbox:hover{border-color:var(--sage)}
.pbox.M{border-left:3px solid var(--male)}.pbox.F{border-left:3px solid var(--female)}
.pbox.unk{border-style:dashed;cursor:default;color:var(--muted)}
.pbox.self{background:var(--sage-l)}
.pbox .pn{font-weight:650;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbox .pm{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pedwrap{overflow-x:auto;padding-bottom:4px}
.coi{display:inline-flex;align-items:baseline;gap:6px}
.coi b{font-family:var(--f-display);font-size:24px}

/* forms / sheet */
.overlay{position:fixed;inset:0;background:rgba(10,18,14,.5);display:flex;align-items:flex-end;justify-content:center;z-index:70}
.overlay[hidden]{display:none!important}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-2)}
@media (min-width:760px){.overlay{align-items:center;padding:24px}.sheet{border-radius:12px;max-height:88vh}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;position:sticky;top:-20px;background:var(--surface);padding:6px 0 10px;z-index:2;border-bottom:1px solid var(--line-2)}
.sheet-h h2{font-size:20px}
.x{border:1px solid var(--line);background:var(--surface-2);width:34px;height:34px;border-radius:8px;font-size:16px;line-height:1}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;font-weight:650;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;min-height:40px;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--forest-2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--forest-2) 16%,transparent)}
.formfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;grid-column:1/-1;margin-top:6px;padding-top:12px;border-top:1px solid var(--line-2)}
.picklist{border:1px solid var(--line);border-radius:9px;max-height:260px;overflow:auto;background:var(--surface-2)}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line-2);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick input{width:17px;height:17px;accent-color:var(--forest);flex:none}
.pick .pm{font-size:12px;color:var(--muted)}
.wtable input{width:84px;border:1px solid var(--line);border-radius:7px;padding:7px;background:var(--surface);text-align:right;font-variant-numeric:tabular-nums}
.wtable select{border:1px solid var(--line);border-radius:7px;padding:6px;background:var(--surface)}
.offrow{display:grid;grid-template-columns:1.2fr .9fr .8fr .9fr 1fr;gap:8px;align-items:end;padding:10px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2)}
.callout{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--info-bg);color:var(--ink)}
.callout.warn{background:var(--warn-bg)}.callout.bad{background:var(--bad-bg)}.callout.ok{background:var(--ok-bg)}
.lpick{display:flex;flex-wrap:wrap;gap:6px}
.lpick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px;cursor:pointer;background:var(--surface)}
.lpick input{accent-color:var(--forest)}

/* charts & bars */
.bars{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line-2)}
.bars span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.meter{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--forest-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
details.more summary{cursor:pointer;font-weight:650;color:var(--muted);padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:90;box-shadow:var(--shadow-2);max-width:calc(100% - 32px)}
.toast[hidden]{display:none!important}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-l);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px}
.loading{display:grid;place-items:center;min-height:50vh;text-align:center;color:var(--muted)}
.welcome{max-width:760px;margin:20px auto}
.wel-h{background:var(--forest);color:#fff;border-radius:12px;padding:22px 24px}
.wel-h h1{color:#fff}.wel-h p{opacity:.85;margin:6px 0 0}

/* ---------- responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.split.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
 .shell{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .topbar{padding:8px 16px;gap:8px}
 .gsearch{order:-1;flex:1 1 100%;max-width:none;margin:0}
 .gsearch kbd{display:none}
 .spseg{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
 .spseg button{justify-content:center;padding:6px 4px;font-size:11px}
 .topbtn{display:none}
 .content{padding:16px 16px calc(150px + env(safe-area-inset-bottom,0px))}
 .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:40}
 .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:650;color:var(--muted);padding:4px 0}
 .tabbar button svg{width:22px;height:22px}
 .tabbar button.on{color:var(--ink)}.tabbar button.on svg{color:var(--forest-2)}
 .fab-wrap{display:block;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:41}
 .fab{width:54px;height:54px;border-radius:14px;border:0;background:var(--gold);color:#1e1600;font-size:28px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
 h1{font-size:24px}.overview h1{font-size:26px}.overview{grid-template-columns:1fr}
 .g3{grid-template-columns:minmax(0,1fr)}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .kpi .val{font-size:26px}
 .dash{display:flex;flex-direction:column}
 .dash .kpi.hide-m{display:none}.dash .o-kpi{order:1}.dash>.split{order:2}.dash .kpi{padding:10px 12px}.dash .kpi .val{font-size:24px;margin-top:2px}
 .phead{grid-template-columns:minmax(0,1fr);gap:10px}.photo{display:none}.photo.has{display:grid;width:72px;height:72px}
 .preg{grid-template-columns:auto minmax(0,1fr)}.preg .pa{grid-column:1/-1}
 .bnext{gap:14px;padding:16px}.bnext .cd{width:80px}.bnext .cd b{font-size:38px}.brow{grid-template-columns:auto minmax(0,1fr) auto;gap:10px}.brow .chev{display:none}
 .offrow{grid-template-columns:1fr 1fr}
 .batchbar{top:112px}
}
@media (max-width:620px){.bcard.grp{grid-column:auto}}
@media (max-width:520px){.g2,.g4{grid-template-columns:minmax(0,1fr)}.form{grid-template-columns:minmax(0,1fr)}.births{grid-template-columns:minmax(0,1fr)}.qa{grid-template-columns:repeat(3,minmax(0,1fr))}.qa button{min-height:68px;padding:10px;font-size:12px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .16s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.7}to{transform:none;opacity:1}}}

/* ---------- additions: lists, cards, new pages ---------- */
.m-only{display:none!important}
.seg.scroll{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{white-space:nowrap;flex:none}
.tablewrap.flat{border:0;border-radius:0}
.flag{display:inline-block;font-size:11.5px;font-weight:650;color:var(--bad)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.mrow:active{background:var(--surface-2)}
.mrow.selr{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--surface))}
.mtop{display:flex;align-items:center;gap:8px;min-width:0}
.mtop b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.mpreg{font-size:12px;font-weight:650;color:var(--ink-2);background:var(--surface-2);padding:2px 8px;border-radius:6px}
.mpreg.hot{background:var(--bad);color:#fff}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.mstats div{background:var(--surface-2);border-radius:7px;padding:6px 8px;min-width:0}
.mstats span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.mstats b{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brow.inv{grid-template-columns:minmax(0,1fr) auto 18px}
/* projections */
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--forest);color:#fff;border-radius:12px;padding:20px 22px;margin-top:16px}
.verdict.loss{background:#5B2620}
.verdict .eyebrow{color:var(--gold)}
.verdict .v-big{font-family:var(--f-display);font-size:34px;font-weight:850;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.verdict .v-sub{opacity:.85;margin-top:4px;font-size:13.5px}
.verdict .v-side{display:flex;gap:20px}
.verdict .v-side span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:700}
.verdict .v-side b{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
/* shows */
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.evcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;box-shadow:var(--shadow)}
.evcard:hover{border-color:var(--sage)}
.evhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.readybar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;vertical-align:middle;margin-right:6px}
.readybar span{display:block;height:100%;background:var(--forest-2)}
.checkl{display:flex;flex-direction:column}
.chkrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line-2);font-size:15px;cursor:pointer}
.chkrow input{width:22px;height:22px;accent-color:var(--forest);flex:none}
.chkrow.auto{cursor:default}
.tick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.tick.ok{background:var(--forest-2);color:#fff}.tick.no{background:var(--bad);color:#fff}
/* calendar */
:root{--c-birth:#B8912A;--c-health:#46789B;--c-feed:#9A6B3F;--c-wean:#2F7D4A;--c-event:#7A5C8E;--c-invoice:#5D6A62;--c-rem:#8A8F8C}
.t-birth{--tc:var(--c-birth)}.t-health{--tc:var(--c-health)}.t-feed{--tc:var(--c-feed)}.t-wean{--tc:var(--c-wean)}.t-event{--tc:var(--c-event)}.t-invoice{--tc:var(--c-invoice)}.t-rem{--tc:var(--c-rem)}
.cal-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cal-title{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cal-title h1{font-size:38px;font-weight:850;letter-spacing:-.02em}
.cal-title h1 span{color:var(--muted);font-weight:500}
.cal-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.6fr);gap:10px;margin-bottom:12px}
.cs{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.cs-ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc);flex:none}
.cs-ic svg{width:18px;height:18px}
.cs b{display:block;font-family:var(--f-display);font-size:22px;font-weight:850;line-height:1}
.cs span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cs.next{background:var(--forest);border-color:var(--forest);color:#fff;cursor:pointer}
.cs.next span{color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin:0 0 3px}
.cs.next b{font-family:var(--f-body);font-size:15px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs.next>div{min-width:0}
.calf{display:flex;gap:6px;flex-wrap:wrap}
.calf button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.calf button i{width:9px;height:9px;border-radius:50%;background:var(--tc)}
.calf button.off{opacity:.45;background:transparent}
.calf button.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--tc)}
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cal-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-wd{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 10px 10px;border-bottom:1px solid var(--line)}
.cal-wd.we,.cal-cell.we{background:color-mix(in srgb,var(--stone) 35%,var(--surface))}
.cal-cell{position:relative;min-height:112px;border:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);background:var(--surface);text-align:left;padding:8px 6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;font:inherit;transition:background .12s}
.cal-cell:nth-child(7n+7){border-right:0}
.cal-cell:hover{background:var(--sage-l)}
.cal-cell.other .cal-n{opacity:.35}
.cal-cell.other .cal-ev{opacity:.55}
.cal-cell.past:not(.today) .cal-n{color:var(--muted)}
.cal-cell.sel{background:var(--sage-l);box-shadow:inset 0 0 0 2px var(--forest-2)}
.cal-n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin:-2px 0 2px -2px}
.cal-cell.today .cal-n{background:var(--gold);color:#201800}
.cal-ev{display:block;font-size:11.5px;line-height:1.35;padding:2px 6px 2px 7px;border-radius:5px;background:color-mix(in srgb,var(--tc) 13%,var(--surface));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 3px 0 0 var(--tc)}
.cal-ev.bad{background:var(--bad);color:#fff;box-shadow:none;font-weight:650}
.cal-more{font-size:11px;color:var(--muted);padding-left:6px;font-weight:600}
.cal-dots{display:none}
.cal-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 16px 10px;box-shadow:var(--shadow);position:sticky;top:76px}
.cal-ph{display:flex;align-items:center;gap:14px;padding:14px 0 12px;border-bottom:1px solid var(--line-2);margin-bottom:4px}
.cal-big{font-family:var(--f-display);font-size:44px;font-weight:850;line-height:1;color:var(--forest-2);min-width:52px}
.cal-ph b{display:block;font-family:var(--f-display);font-size:18px}
.cal-ph span{font-size:12.5px;color:var(--muted)}
.cal-none{padding:22px 0;text-align:center;color:var(--muted);font-size:13px}
.cal-it{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.cal-it:last-child{border-bottom:0}
.cal-it .cal-ic{width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--tc) 14%,var(--surface));display:grid;place-items:center;color:var(--tc)}
.cal-it .cal-ic svg{width:17px;height:17px}
.cal-it.bad .cal-ic{background:var(--bad);color:#fff}
.cal-it b{font-weight:600}
.cal-tl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);white-space:nowrap}
.agenda{display:flex;flex-direction:column;gap:10px}
.ag-day{display:grid;grid-template-columns:70px minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.ag-date{background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;border-right:1px solid var(--line-2)}
.ag-date b{font-family:var(--f-display);font-size:28px;font-weight:850;line-height:1}
.ag-date span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.ag-date em{font-style:normal;font-size:11px;color:var(--muted)}
.ag-day.today .ag-date{background:var(--forest);border-color:var(--forest)}
.ag-day.today .ag-date b{color:#fff}.ag-day.today .ag-date span,.ag-day.today .ag-date em{color:var(--gold)}
.ag-items{padding:2px 16px}
.ag-rel{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--forest-2);padding-top:10px}
/* breeding pipeline */
.pipe{display:flex;align-items:stretch;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pstage{flex:1 1 0;min-width:130px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;box-shadow:var(--shadow);cursor:pointer}
.pstage:hover{border-color:var(--sage)}
.pstage .pnum{font-family:var(--f-display);font-size:34px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}
.pstage .plab{font-weight:750;font-size:14px;margin-top:4px}
.pstage .pdesc{font-size:12px;color:var(--muted)}
.pstage.on{background:var(--forest);border-color:var(--forest);color:#fff}
.pstage.on .pdesc{color:rgba(255,255,255,.75)}
.pstage.hot:not(.on) .pnum{color:var(--bad)}
.pstage.hot.on{background:var(--bad);border-color:var(--bad)}
.parrow{align-self:center;color:var(--muted);font-size:22px;flex:none}
.brow2{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line-2);cursor:pointer}
.brow2:first-child{border-top:0}
.brow2:hover{background:var(--surface-2)}
.b2line{margin-top:4px}
.bstat{font-size:12px;font-weight:650;color:var(--ink-2);background:var(--surface-2);padding:3px 9px;border-radius:6px;white-space:nowrap}
.bstat.warn{color:var(--warn-ink);background:var(--warn-bg)}
/* weights */
.qw{display:grid;grid-template-columns:150px 130px 130px auto auto;gap:12px;align-items:end}
.qw .btn{min-height:40px}
.qw .fampick{align-self:flex-start}.qw .f{min-width:0}
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pj{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.pj span{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.pj b{font-family:var(--f-display);font-size:24px;font-weight:850;font-variant-numeric:tabular-nums}
.pj em{font-style:normal;font-size:11.5px;color:var(--muted)}
.pj.key{border-color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.pj.hit{background:var(--forest);border-color:var(--forest);color:#fff}.pj.hit span,.pj.hit em{color:rgba(255,255,255,.75)}
.rklist{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.rk:last-child{border-bottom:0}
.rk b{font-variant-numeric:tabular-nums}
/* invoice */
.invwrap{background:var(--stone);border-radius:12px;padding:24px;overflow-x:auto}
/* ---------- phone ---------- */
@media (max-width:820px){
  .dt-only{display:none!important}.m-only{display:flex!important}
  body{font-size:15px}
  .f input,.f select,.f textarea,input.search,select.sel,.gsearch input,.wtable input,.wtable select,.offrow input,.row input{font-size:16px}
  .btn{min-height:44px;padding:10px 14px;font-size:14px}
  .btn.sm{min-height:36px;padding:7px 12px}
  .btn.link{min-height:0;padding:0}
  .pagehead{align-items:stretch}
  .pagehead>.row{width:100%}
  .pagehead>.row>.btn{flex:1 1 auto}
  .pagehead h1{font-size:24px}
  .overlay{align-items:stretch}
  .sheet{max-height:none;height:100%;border-radius:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
  .sheet>form{flex:1}
  .sheet-h{top:-12px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
  .formfoot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--surface);margin:6px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:3}
  .formfoot .btn{flex:1}
  .formfoot .btn[style*="margin-right:auto"]{flex:0 0 auto}
  .pick{padding:12px 10px}.pick input{width:22px;height:22px}
  .picklist{max-height:50vh}
  .tabs{margin:16px -16px 14px;padding:0 16px}
  .tabs button{padding:12px 12px}
  .phead .row.between{flex-direction:column;align-items:flex-start}
  .phead>div{min-width:0}
  .phead .row.between>.row:last-child{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:4px;scrollbar-width:none}
  .phead .row.between>.row:last-child .btn{flex:none}
  .calf{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.calf button{flex:none}
  .idgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .verdict{grid-template-columns:1fr}.verdict .v-big{font-size:28px}
  .evhead{grid-template-columns:auto minmax(0,1fr)}.evhead .acts{grid-column:1/-1}
  .evgrid{grid-template-columns:minmax(0,1fr)}
  .cal-title h1{font-size:28px}
  .cal-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.cs.next{grid-column:1/-1}.cs{padding:10px 12px}
  .cal-layout{grid-template-columns:minmax(0,1fr)}
  .cal-panel{position:static}
  .cal-cell{min-height:54px;padding:4px 2px;align-items:center}
  .cal-cell .cal-ev,.cal-cell .cal-more{display:none}
  .cal-n{margin:0 auto 2px}
  .cal-dots{display:flex;gap:3px;justify-content:center}
  .cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--tc)}
  .cal-dots i.bad{background:var(--bad);box-shadow:0 0 0 1.5px var(--surface)}
  .cal-wd{padding:8px 2px;text-align:center;font-size:10px}
  .ag-day{grid-template-columns:58px minmax(0,1fr)}.ag-items{padding:2px 12px}
  .cal-tl{display:none}
  .qw{grid-template-columns:1fr 1fr}.qw .btn{grid-column:1/-1}.qw .f:nth-child(4){grid-column:1/-1}
  .pstage{min-width:112px;padding:12px}.pstage .pnum{font-size:28px}
  .parrow{display:none}
  .brow2{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}.b2act{grid-column:1/-1}.b2act .btn{width:100%}
  .invwrap{padding:0;background:none}
  .wtable thead{display:none}
  .wtable tr{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .wtable td{border:0;padding:2px 4px}
  .wtable td:first-child{grid-column:1/-1}
  .wtable input{width:100px}
  .batchbar{position:fixed;left:8px;right:8px;top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:45;flex-wrap:nowrap;overflow-x:auto}
  .batchbar .btn{flex:none}
  .kpi.lite .val{font-size:20px}
  .kpis:has(>:nth-child(5)){display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x proximity}
  .kpis:has(>:nth-child(5))>.kpi{flex:0 0 46%;scroll-snap-align:start}
  .kpis::-webkit-scrollbar{display:none}
  .mfbtn{width:100%;margin-bottom:10px}
  .fbar:not(.open){display:none}
  .fbar .sel{flex:1 1 45%}
  .banner{padding:8px 12px;font-size:13px;gap:8px}.banner .btn{min-height:32px}
  .preg .pa .btn{width:100%}
}

/* ---------- plans & SaaS ---------- */
.brand .brand-sub{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);opacity:1;margin-top:2px;font-weight:700}
#planBox{padding:0 4px 8px}
.planbox{width:100%;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--side-line);border-radius:9px;padding:8px 10px;color:var(--side-ink);font-size:12px;text-align:left}
.planbox:hover{background:rgba(255,255,255,.1)}
.planb{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;padding:3px 7px;border-radius:5px;background:var(--stone);color:var(--ink-2);white-space:nowrap}
.planb.pro{background:var(--gold);color:#201800}
.planb.farm_pro{background:#0E2A23;color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.side .planb.free{background:rgba(255,255,255,.14);color:#fff}
.navbtn.locked{opacity:.62}
.navbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.navbtn .ptag{margin-left:auto;flex-shrink:0;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,162,39,.5);border-radius:4px;padding:0 5px}
.lockb{font-size:10px;margin-left:4px}
.farmbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px;min-height:40px;max-width:220px}
.farmbtn svg{width:16px;height:16px;color:var(--forest-2);flex:none}.farmbtn svg:last-child{transform:rotate(90deg);width:13px;color:var(--muted)}
.farmbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.farmbtn[hidden]{display:none!important}
.banner.preview{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.locked-wrap{display:grid;place-items:center;padding:30px 0}
.upg{max-width:560px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 32px;text-align:center;box-shadow:var(--shadow-2);position:relative;overflow:hidden}
.upg::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--forest),var(--gold))}
.upg.inline{box-shadow:none;border:0;padding:10px 4px;max-width:none;margin:0 auto}
.upg.inline::before{display:none}
.upg-ic{width:56px;height:56px;border-radius:14px;background:var(--sage-l);color:var(--forest-2);display:grid;place-items:center;margin:0 auto 14px}
.upg-ic svg{width:26px;height:26px}
.upg-tier{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold-ink)}
:root[data-theme="dark"] .upg-tier{color:var(--gold)}
.upg-h{font-size:24px;margin:6px 0 8px}
.upg-p{color:var(--muted);margin:0 auto 18px;max-width:440px;line-height:1.55}
.upg-price{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-bottom:18px}
.upg-price b{font-family:var(--f-display);font-size:38px;font-weight:850}
.upg-price span{color:var(--muted)}
.upg-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.upsell{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed color-mix(in srgb,var(--gold) 60%,var(--line));background:color-mix(in srgb,var(--gold) 6%,var(--surface));border-radius:12px;padding:14px 16px}
.upsell b{display:block}.upsell span{font-size:13px;color:var(--muted)}
.usage{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.usage span{font-size:12.5px;color:var(--muted)}
.usage .meter{margin-top:8px;height:8px}
.usage.full{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}.usage.full .meter span{background:var(--bad)}
.pr-head{text-align:center;max-width:640px;margin:10px auto 26px}
.pr-head h1{font-size:34px;margin:6px 0 8px}.pr-head p{color:var(--muted);margin:0}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch;max-width:1080px;margin:0 auto}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.pcard.pop{border:2px solid var(--gold);box-shadow:0 14px 40px rgba(201,162,39,.18);transform:translateY(-6px)}
.pc-pop{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#201800;font-size:10.5px;font-weight:800;letter-spacing:.14em;padding:4px 12px;border-radius:99px;white-space:nowrap}

.pcard.farm_pro li svg{color:var(--gold)}
.pcard.farm_pro .btn{background:var(--gold);color:#201800}
.pcard.farm_pro .btn.link{background:none;color:var(--gold)}
.pc-name{font-family:var(--f-display);font-size:22px;font-weight:850;letter-spacing:.02em}
.pc-who{font-size:13px;color:var(--muted)}
.pc-price{display:flex;align-items:baseline;gap:4px;margin:12px 0 2px}
.pc-price b{font-family:var(--f-display);font-size:44px;font-weight:850;line-height:1}
.pc-price span{color:var(--muted)}
.pc-lim{font-size:13px;font-weight:650;color:var(--ink-2);margin-bottom:10px}
.pcard ul{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:13.5px;line-height:1.4}
.pcard li svg{width:14px;height:14px;color:var(--forest-2);margin-top:3px}
.pcard .btn{width:100%}
.t.cmp td.c,.t.cmp th.c{text-align:center}
