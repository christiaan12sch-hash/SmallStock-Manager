<script>
"use strict";
/* ============ CONFIG ============ */
const SP = {
  goat:{key:'goat',label:'Goats',one:'Goat',F:'Doe',M:'Buck',C:'Wether',young:'Kid',youngPl:'Kids',birth:'Kidding',born:'kidded',verb:'kid',gest:150,wean:100,dress:48,color:'#C9862B',
    breeds:['Boer','Kalahari Red','Savanna','Indigenous Veld Goat','Tswana (indigenous)','Nguni Goat','Saanen','Toggenburg','British Alpine','Anglo-Nubian','Angora','Boer cross','Mixed / Other']},
  sheep:{key:'sheep',label:'Sheep',one:'Sheep',F:'Ewe',M:'Ram',C:'Wether',young:'Lamb',youngPl:'Lambs',birth:'Lambing',born:'lambed',verb:'lamb',gest:147,wean:100,dress:47,color:'#5B8C6E',
    breeds:['Dorper','White Dorper','Meatmaster','Damara','Van Rooy','Merino','Dohne Merino','SA Mutton Merino','Dormer','Ile de France','Karakul','Swakara','Blackhead Persian','Tswana sheep','Pedi','Nguni sheep','Cross / Other']}
};
const COUNTRIES = {
  BW:{name:'Botswana',cur:'P',idLabel:'BAITS / official tag no.'},
  ZA:{name:'South Africa',cur:'R',idLabel:'Brand / tattoo mark'},
  NA:{name:'Namibia',cur:'N$',idLabel:'NamLITS tag no.'},
  ZW:{name:'Zimbabwe',cur:'US$',idLabel:'Official tag no.'},
  LS:{name:'Lesotho',cur:'M',idLabel:'Official tag no.'},
  SZ:{name:'Eswatini',cur:'E',idLabel:'Official tag no.'},
  ZM:{name:'Zambia',cur:'K',idLabel:'Official tag no.'},
  MZ:{name:'Mozambique',cur:'MT',idLabel:'Official tag no.'},
  KE:{name:'Kenya',cur:'KSh',idLabel:'Official tag no.'},
  OT:{name:'Other',cur:'$',idLabel:'Official ID'}
};
const REG_TYPES = ['Stud (registered)','Flock / commercial (registered)','Commercial','Unregistered'];
const STATUSES = {active:'On farm',sold:'Sold',dead:'Died',slaughtered:'Slaughtered',culled:'Culled',missing:'Missing / stolen',ref:'Ancestor (not on farm)'};
const HEALTH_TYPES = ['Vaccination','Deworming / dosing','Dipping / pour-on','Treatment','Vet visit','Hoof trimming','Castration','Tail docking','Pregnancy test','FAMACHA check','Other'];
const TXN_CATS = {income:['Animal sales','Breeding stock sales','Meat / carcass sales','Wool / mohair / pelts','Milk','Subsidy / grant','Other income'],
  expense:['Feed','Vet & medicine','Breeding stock purchase','Labour','Transport','Equipment & fencing','Water & electricity','Fees, levies & permits','Fuel','Repairs','Other expense']};
const BIRTH_EASE = ['Unassisted','Slight help','Assisted','Vet assisted','Caesarean'];
const DEFAULT_SETTINGS = {kind:'settings',famScale:'official',farmName:'',country:'BW',currency:'P',species:['goat','sheep'],camps:['Kraal','Camp 1','Camp 2'],
  prices:{goat:{perKg:0,young:0,adult:0},sheep:{perKg:0,young:0,adult:0}},tagPrefix:'',setup:false,
  targets:{goat:{sale:35,saleAge:240},sheep:{sale:40,saleAge:210}},
  biz:{name:'',address:'',phone:'',email:'',vatNo:'',bank:'',terms:'Payment due within 7 days of invoice date.',vat:0,prefix:'INV'},
  weighEvery:14,
  proj:{keepF:60,sellAge:8,adultDeath:3,youngPrice:0,costHeadMonth:0}};

/* ============ UTILS ============ */
const $ = s=>document.querySelector(s);
const esc = v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n=>String(n).padStart(2,'0');
const isoD = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let TODAY = isoD(new Date());
const parseD = s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const validD = s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const addD = (s,n)=>{const d=parseD(s);d.setDate(d.getDate()+Math.round(n));return isoD(d)};
const diffD = (a,b)=>Math.round((parseD(b)-parseD(a))/864e5); // days from a to b
const fmtD = s=>validD(s)?parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtDs = s=>validD(s)?parseD(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—';
const num = v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const numOrNull = v=>{if(v===''||v==null)return null;const n=parseFloat(v);return isFinite(n)?n:null};
const fmtN = (n,d=0)=>n==null||!isFinite(n)?'—':Number(n).toLocaleString('en-ZA',{minimumFractionDigits:d,maximumFractionDigits:d}).replace(/ /g,' ');
const money = (n,d=0)=>n==null||!isFinite(n)?'—':(n<0?'−':'')+cur()+' '+fmtN(Math.abs(n),d);
const cur = ()=>settings().currency||'P';
const uid = p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const plural = (n,a,b)=>n===1?a:(b||a+'s');
const relDays = d=>d===0?'today':d===1?'tomorrow':d===-1?'yesterday':d>0?`in ${d} days`:`${-d} days ago`;
const byDate = (a,b)=>(a.date||'').localeCompare(b.date||'');
const sum = (arr,f)=>arr.reduce((s,x)=>s+(f?f(x):x),0);

/* ============ STATE & STORE ============ */
const S = {account:null,actAs:'owner',recs:new Map(),ver:0,mode:'loading',sp:'all',view:{page:'home'},sel:new Set(),f:{status:'active',sex:'all',camp:'all',q:'',sort:'tag',dir:1,cls:'all',breed:'all',label:'all',ids:null,idsLabel:''},tf:{q:'',sex:'all',breed:'all',status:'active',camp:'all',label:'all'},caps:{}};
const memo = {};
function bump(){S.ver++;for(const k in memo)delete memo[k]}
function M(key,fn){if(!(key in memo))memo[key]=fn();return memo[key]}
const recsOf = kind=>M('k:'+kind,()=>[...S.recs.values()].filter(r=>r.kind===kind));
const settings = ()=>M('settings',()=>{const r=S.recs.get('settings')||{};const o=Object.assign({},DEFAULT_SETTINGS,r);['prices','targets','biz','proj'].forEach(k=>o[k]=Object.assign({},DEFAULT_SETTINGS[k],r[k]||{}));o.species=(o.species||[]).filter(k=>SP[k]);if(!o.species.length)o.species=['goat','sheep'];return o});
const A = id=>{const r=id&&S.recs.get(id);return r&&r.kind==='animal'?r:null};
const animals = ()=>M('animals',()=>recsOf('animal').filter(a=>SP[a.species]));
const onFarm = ()=>M('onfarm',()=>animals().filter(a=>a.status==='active'));
const spOn = ()=>settings().species.filter(k=>SP[k]);

/* Storage. Each farm's records live apart: the main farm in the original place, extra farms in their
   own collection / browser key. The account record (plan, team, farms) lives with the main farm. */
const Store = {
  db:null, root:null, chains:{}, lsKey:'smallstock_manager_pro_v1', lsAcct:'smallstock_account_v1', unsub:null, acctUnsub:null,
  farmId:'main',
  col(){return this.farmId==='main'?this.db.collection(this.root):this.db.doc(this.root+'/farm-'+this.farmId).collection('recs')},
  lsFarmKey(){return this.farmId==='main'?this.lsKey:this.lsKey+'_'+this.farmId},
  async init(){
    const cl = window.claude;
    try{const f=localStorage.getItem('ssm_farm');if(f)this.farmId=f}catch(e){}
    if(cl && typeof cl.use==='function'){
      try{
        const [db,user,dl] = await Promise.all([cl.use('db'),cl.use('user'),cl.use('downloads')]);
        S.caps.downloads = dl;
        const id = user ? await user.id() : null;
        let canW=null;try{canW=user&&typeof user.can==='function'?await user.can('data.write'):null}catch(e){}
        if(db && id && canW!==false){
          this.db=db; this.root='data/users/'+id; S.mode='cloud';
          this.acctUnsub=db.doc(this.root+'/account').onSnapshot(d=>{S.account=d.exists?Object.assign({},d.data()):null;bump();render()},()=>{});
          this.openFarm(this.farmId);
          return;
        }
      }catch(e){console.warn(e)}
    }
    try{S.account=JSON.parse(localStorage.getItem(this.lsAcct)||'null')}catch(e){S.account=null}
    this.loadLocal();
  },
  openFarm(fid){
    this.farmId=fid||'main';try{localStorage.setItem('ssm_farm',this.farmId)}catch(e){}
    if(S.mode==='cloud'||this.db&&S.mode!=='local'){
      if(this.unsub)this.unsub();S.recs=new Map();S.loadingFarm=true;bump();render();
      this.unsub=this.col().onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{const x=d.data();if(x&&d.id!=='account')m.set(d.id,Object.assign({},x))});S.recs=m;S.loadingFarm=false;bump();render()},
        err=>{toast('Could not reach your saved farm data ('+(err&&err.code||'error')+'). Changes stay on screen only.');S.mode='memory';render()});
    }else this.loadLocal();
  },
  loadLocal(){
    let ok=true,data=null;
    try{data=JSON.parse(localStorage.getItem(this.lsFarmKey())||'null')}catch(e){ok=false}
    S.mode=ok?'local':'memory';
    S.recs=new Map(); (data&&data.recs||[]).forEach(r=>r&&r._id&&r.kind!=='account'&&S.recs.set(r._id,r));
    bump(); render();
  },
  saveLocal(){ if(S.mode!=='local')return; const key=this.lsFarmKey(),recs=[...S.recs.values()]; clearTimeout(this._t); this._t=setTimeout(()=>{try{localStorage.setItem(key,JSON.stringify({v:1,recs}))}catch(e){toast('This browser would not save. Export a backup from Settings.')}},150) },
  putAccount(acc){
    acc=Object.assign({},acc,{kind:'account',_id:'account',updated:new Date().toISOString()});S.account=acc;bump();
    if(S.mode==='cloud'){const body=JSON.parse(JSON.stringify(acc));this.chain('account',()=>this.db.doc(this.root+'/account').set(body))}
    else{try{localStorage.setItem(this.lsAcct,JSON.stringify(acc))}catch(e){}}
  },
  /* every write passes the permission service first */
  put(rec,opt){
    if(!(opt&&opt.system)&&!Access.guardWrite(rec.kind,!rec._id||!S.recs.has(rec._id),rec))return rec;
    const isNew=!rec._id||!S.recs.has(rec._id);const before=rec._id?S.recs.get(rec._id):null;
    if(!rec._id)rec._id=uid(rec.kind==='animal'?'a':rec.kind.slice(0,3));
    rec.updated=new Date().toISOString();if(isNew&&!rec.by)rec.by=Access.actorName();
    S.recs.set(rec._id,rec); bump();
    if(S.mode==='cloud'){const id=rec._id,body=JSON.parse(JSON.stringify(rec));this.chain(id,()=>this.col().doc(id).set(body))}
    else this.saveLocal();
    if(!(opt&&opt.nolog))Activity.onWrite(rec,isNew,before);
    return rec;
  },
  del(id,opt){
    const r=S.recs.get(id);if(r&&!(opt&&opt.system)&&!Access.guardDelete(r.kind))return;
    S.recs.delete(id); bump();
    if(S.mode==='cloud')this.chain(id,()=>this.col().doc(id).delete());
    else this.saveLocal();
    if(r&&!(opt&&opt.nolog))Activity.onDelete(r);
  },
  chain(id,fn){
    const p=(this.chains[id]||Promise.resolve()).then(fn).catch(e=>{
      const c=e&&e.code;
      if((c==='invalid_argument'||c==='not_granted'||c==='revoked')&&S.mode==='cloud'){S.mode='local';this.saveLocal();try{localStorage.setItem(this.lsAcct,JSON.stringify(S.account||null))}catch(e){}if(!this._fellBack){this._fellBack=true;toast('Saving in this browser instead');render()}return}
      if(c==='unavailable'){return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(fn).catch(()=>toast('A change did not save. Check your connection.'))}
      toast(c==='quota_exceeded'?'Storage is full. Export a backup and remove old records.':'A change did not save ('+(c||'error')+').');
    });
    this.chains[id]=p; return p;
  },
  async bulk(recs,progress){
    recs.forEach(r=>{if(!r._id)r._id=uid(r.kind==='animal'?'a':r.kind.slice(0,3));r.updated=new Date().toISOString();S.recs.set(r._id,r)});
    bump(); render();
    if(S.mode!=='cloud'){this.saveLocal();return}
    let i=0; const q=[...recs];
    const worker=async()=>{while(q.length){const r=q.shift();const body=JSON.parse(JSON.stringify(r));await this.chain(r._id,()=>this.col().doc(r._id).set(body));i++;progress&&progress(i,recs.length)}};
    await Promise.all([worker(),worker(),worker()]);
  },
  async wipe(filter){
    const ids=[...S.recs.values()].filter(filter).map(r=>r._id);
    ids.forEach(id=>S.recs.delete(id)); bump(); render();
    if(S.mode!=='cloud'){this.saveLocal();return}
    const q=[...ids];const worker=async()=>{while(q.length){const id=q.shift();await this.chain(id,()=>this.col().doc(id).delete())}};
    await Promise.all([worker(),worker(),worker()]);
  },
  async wipeFarm(fid){
    if(S.mode==='cloud'){const c=fid==='main'?this.db.collection(this.root):this.db.doc(this.root+'/farm-'+fid).collection('recs');const snap=await c.get();for(const d of snap.docs){if(d.id!=='account')await c.doc(d.id).delete()}}
    else{try{localStorage.removeItem(fid==='main'?this.lsKey:this.lsKey+'_'+fid)}catch(e){}}
  }
};
function saveSettings(patch,opt){const s=Object.assign({},S.recs.get('settings')||DEFAULT_SETTINGS,patch,{kind:'settings',_id:'settings'});Store.put(s,opt)}

/* ============ DERIVED: animals ============ */
const spOf = a=>SP[a&&a.species]||SP.goat;
const tagOf = a=>a?(a.tag||'(no tag)'):'—';
const nameOf = a=>a?(a.name?`${a.tag} · ${a.name}`:a.tag||'(no tag)'):'Unknown';
function ageDays(a,at){return a&&validD(a.dob)?diffD(a.dob,at||TODAY):null}
function ageText(d){if(d==null)return '—';if(d<0)return 'not born';if(d<45)return d+' d';const m=Math.floor(d/30.44);if(m<24)return m+' mo';const y=Math.floor(m/12),mm=m%12;return y+' y'+(mm?' '+mm+' mo':'')}
function sexWord(a){const s=spOf(a);return a.sex==='M'?s.M:a.sex==='C'?s.C:s.F}
function hasBirthed(a){return M('birthed',()=>new Set(recsOf('birth').map(b=>b.dam))).has(a._id)}
function ageClass(a){
  const s=spOf(a),d=ageDays(a);
  if(d==null)return sexWord(a);
  if(d<s.wean)return s.young; if(d<365)return 'Weaner';
  if(d<730)return a.species==='sheep'?(a.sex==='F'?'Hogget ewe':a.sex==='M'?'Hogget ram':'Hogget'):(a.sex==='F'?'Young doe':a.sex==='M'?'Young buck':'Young wether');
  return sexWord(a);
}
function classGroup(a){const s=spOf(a),d=ageDays(a);if(d!=null&&d<s.wean)return 'young';if(d!=null&&d<365)return 'weaner';return 'adult'}
function teeth(a){
  if(a.teeth)return a.teeth;
  const d=ageDays(a);if(d==null)return null;
  if(d<365)return 'Milk teeth';if(d<548)return '2-tooth';if(d<760)return '4-tooth';if(d<1000)return '6-tooth';if(d<2555)return 'Full mouth';return 'Full / broken mouth';
}
const breedingAge = a=>{const d=ageDays(a);return d==null||d>=240};

/* weights from weigh sessions */
function weightMap(){return M('wmap',()=>{const m={};recsOf('weigh').slice().sort(byDate).forEach(w=>{for(const id in (w.entries||{})){const e=w.entries[id];if(!e)continue;(m[id]=m[id]||[]).push({date:w.date,kg:numOrNull(e.kg),bcs:numOrNull(e.bcs),fam:numOrNull(e.fam),label:w.label||'',sid:w._id})}});return m})}
const weightsOf = id=>(weightMap()[id]||[]);
const kgsOf = id=>weightsOf(id).filter(w=>w.kg!=null);
function lastKg(id){const k=kgsOf(id);return k.length?k[k.length-1]:null}
function adg(id){const k=kgsOf(id);if(k.length<2)return null;const a=k[k.length-2],b=k[k.length-1],d=diffD(a.date,b.date);return d>0?(b.kg-a.kg)/d*1000:null}
function adgLife(a){const k=kgsOf(a._id);if(k.length<2)return null;const f=k[0],l=k[k.length-1],d=diffD(f.date,l.date);return d>0?(l.kg-f.kg)/d*1000:null}
function birthWt(a){const k=kgsOf(a._id);const b=k.find(w=>validD(a.dob)&&diffD(a.dob,w.date)<=3&&diffD(a.dob,w.date)>=0);return b?b.kg:null}
function wean100(a){
  if(!validD(a.dob))return null;const bw=birthWt(a);if(bw==null)return null;
  const k=kgsOf(a._id).map(w=>({...w,age:diffD(a.dob,w.date)})).filter(w=>w.age>=60&&w.age<=150);
  if(!k.length)return null;k.sort((x,y)=>Math.abs(x.age-100)-Math.abs(y.age-100));const w=k[0];
  return {adj:bw+(w.kg-bw)/w.age*100,raw:w.kg,age:w.age,date:w.date};
}
function lastScore(id,key){const k=weightsOf(id).filter(w=>w[key]!=null);return k.length?k[k.length-1]:null}

/* value */
function valueOf(a){
  if(numOrNull(a.value)!=null)return num(a.value);
  const p=(settings().prices||{})[a.species]||{};const lk=lastKg(a._id);
  if(num(p.perKg)>0&&lk)return lk.kg*num(p.perKg);
  const g=classGroup(a);const v=g==='adult'?num(p.adult):num(p.young);return v>0?v:null;
}

/* ============ PEDIGREE / COI ============ */
function depth(id,seen){
  return M('dep:'+id,()=>{const a=A(id);if(!a)return 0;seen=seen||new Set();if(seen.has(id))return 0;seen.add(id);
    return 1+Math.max(a.sire?depth(a.sire,seen):0,a.dam?depth(a.dam,seen):0)});
}
function kin(x,y){
  if(!x||!y||!A(x)||!A(y))return 0;
  const key='kin:'+(x<y?x+'|'+y:y+'|'+x);
  if(key in memo)return memo[key];
  memo[key]=0; // cycle guard
  let r;
  if(x===y){const a=A(x);r=0.5*(1+kin(a.sire,a.dam))}
  else{let dx=depth(x),dy=depth(y);if(dx<dy){const t=x;x=y;y=t}const a=A(x);r=0.5*(kin(a.sire,y)+kin(a.dam,y))}
  memo[key]=r;return r;
}
const coi = a=>a?kin(a.sire,a.dam):0;
const pct = v=>v==null?'—':(v*100).toFixed(v*100<10&&v>0?2:1)+'%';
function coiLevel(v){return v>=0.125?'bad':v>=0.0625?'warn':'ok'}
function parentLabel(a,which){const p=A(a[which]);if(p)return nameOf(p);const ext=a[which+'Ext'];return ext||'Unknown'}
function offspringOf(id){return M('off:'+id,()=>animals().filter(x=>x.sire===id||x.dam===id))}
function ancestors(id,gen,out){out=out||new Map();const a=A(id);if(!a||gen<=0)return out;[a.sire,a.dam].forEach(p=>{if(p&&A(p)){out.set(p,(out.get(p)||0)+1);ancestors(p,gen-1,out)}});return out}
function commonAncestors(x,y){const ax=ancestors(x,6),ay=ancestors(y,6);const c=[];ax.forEach((v,k)=>{if(ay.has(k))c.push(k)});if(ay.has(x))c.push(x);if(ax.has(y))c.push(y);return [...new Set(c)]}

/* ============ DERIVED: breeding ============ */
function matingFemales(m){return (m.females||[]).filter(Boolean)}
function birthsOf(damId){return M('bo:'+damId,()=>recsOf('birth').filter(b=>b.dam===damId).sort(byDate))}
function scanFor(mId,fId){const s=recsOf('scan').filter(x=>x.mating===mId).sort(byDate).pop();return s?(s.results||{})[fId]||null:null}
function dueWindow(m,f){const s=spOf(A(m.male)||A(f)||{species:m.species});const start=m.date,end=validD(m.end)?m.end:m.date;return {from:addD(start,s.gest),to:addD(end,s.gest),sp:s}}
/* every (mating,female) pair still waiting for a birth */
function pregnancies(){return M('preg',()=>{
  const out=[];
  recsOf('mating').forEach(m=>{matingFemales(m).forEach(fid=>{
    const f=A(fid);if(!f||f.status!=='active')return;
    const w=dueWindow(m,f);const scan=scanFor(m._id,fid);
    if(scan==='empty')return;
    const born=birthsOf(fid).find(b=>diffD(w.from,b.date)>=-35&&diffD(w.to,b.date)<=35);
    if(born)return;
    if(diffD(w.to,TODAY)>30)return; // window long gone: treat as missed
    // superseded by a later mating of the same female
    const later=recsOf('mating').some(m2=>m2!==m&&m2.date>m.date&&matingFemales(m2).includes(fid));
    if(later)return;
    out.push({m,f,from:w.from,to:w.to,scan,dIn:diffD(TODAY,w.from),dEnd:diffD(TODAY,w.to)});
  })});
  return out.sort((a,b)=>a.from.localeCompare(b.from));
})}
const pregnantIds = ()=>M('pregids',()=>new Set(pregnancies().map(p=>p.f._id)));
function kiddingInterval(id){const b=birthsOf(id);if(b.length<2)return null;let t=0;for(let i=1;i<b.length;i++)t+=diffD(b[i-1].date,b[i].date);return t/(b.length-1)}

/* ============ DERIVED: health ============ */
function healthOf(id){return M('ho:'+id,()=>recsOf('health').filter(h=>(h.animals||[]).includes(id)).sort(byDate).reverse())}
function withdrawals(){return M('wd',()=>{const m={};recsOf('health').forEach(h=>{const wd=num(h.withdrawal);if(wd<=0)return;const end=addD(h.date,wd);if(end<=TODAY)return;(h.animals||[]).forEach(id=>{if(!m[id]||m[id].end<end)m[id]={end,product:h.product||h.type,h}})});return m})}
function healthDue(){return M('hdue',()=>{
  const out=[];const all=recsOf('health');
  all.forEach(h=>{if(!validD(h.next))return;
    const key=(h.product||h.type||'').toLowerCase().trim();
    const ids=(h.animals||[]).filter(id=>{const a=A(id);if(!a||a.status!=='active')return false;
      return !all.some(o=>o!==h&&o.date>h.date&&(o.product||o.type||'').toLowerCase().trim()===key&&(o.animals||[]).includes(id))});
    if(ids.length)out.push({h,ids,d:diffD(TODAY,h.next)});
  });return out.sort((a,b)=>a.h.next.localeCompare(b.h.next))})}

/* ============ DERIVED: feed ============ */
function feedNow(f){const days=validD(f.asOf)?Math.max(0,diffD(f.asOf,TODAY)):0;return Math.max(0,num(f.qty)-num(f.daily)*days)}
function feedDaysLeft(f){return num(f.daily)>0?feedNow(f)/num(f.daily):null}
function feedDailyCost(){return sum(recsOf('feed'),f=>num(f.daily)*num(f.unitCost))}

/* ============ SPECIES SCOPE ============ */
const inSp = a=>!!a&&(S.sp==='all'||a.species===S.sp);
const spScope = ()=>S.sp==='all'?null:SP[S.sp];
const pregs = ()=>M('pregs:'+S.sp,()=>pregnancies().filter(p=>inSp(p.f)));
/* birth countdown state: the number shown and how loud it is */
function birthState(p){
  if(p.dEnd<0)return {key:'overdue',lvl:'bad',n:-p.dEnd,unit:plural(-p.dEnd,'day')+' overdue',label:'Overdue'};
  if(p.dIn<=0){ if(p.from===p.to||p.dEnd===0)return {key:'today',lvl:'bad',n:0,unit:'due today',label:'Due today'};
    return {key:'open',lvl:'bad',n:p.dEnd,unit:plural(p.dEnd,'day')+' left in window',label:'Window open'} }
  const d=p.dIn;
  return {key:d<=7?'urgent':d<=14?'attention':d<=30?'soon':'normal',lvl:d<=7?'bad':d<=14?'warn':d<=30?'info':'ok',n:d,unit:plural(d,'day')+' to birth',label:d<=7?'Urgent':d<=14?'Attention':d<=30?'Upcoming':'Pregnant'};
}

/* ============ FAMACHA ============ */
/* Stored scores are never rewritten. "official" reads them the way the FAMACHA card prints them
   (1 = red, healthy · 5 = white, anaemic). "reversed" reads 1 = white · 5 = deep red. */
/* FAMACHA as used on this farm: 1 = white eyelid (bad) … 5 = deep red eyelid (good). Score = grade. */
const FAM_EYE=[null,{c:'#F7F1F0',n:'White',s:'Very pale',d:'Severely anaemic. Treat now.'},{c:'#EFC9CB',n:'Pale pink',s:'Pale',d:'Anaemic. Treat and recheck.'},{c:'#E2A0A6',n:'Pink',s:'Normal',d:'Borderline. Watch closely.'},{c:'#C9545C',n:'Red',s:'Good',d:'Healthy.'},{c:'#962229',n:'Deep red',s:'Very good',d:'Healthy.'}];
const famReversed = ()=>true; // 1 = white (bad) … 5 = deep red (good)
const famGrade = score=>score==null||!isFinite(score)?null:Math.max(1,Math.min(5,Math.round(famReversed()?score:6-score)));
const scoreForGrade = g=>famReversed()?g:6-g;
const famLvl = g=>g==null?'':g<=1?'bad':g===2?'warn':g===3?'watch':'ok';
function famLatest(id){const f=lastScore(id,'fam');return f?{score:f.fam,g:famGrade(f.fam),date:f.date}:null}
function famHigh(id){return weightsOf(id).filter(w=>w.fam!=null&&famGrade(w.fam)<=2).length}
function famBuckets(list){
  const b={poor:[],mid:[],good:[],none:[]};
  list.forEach(a=>{const f=famLatest(a._id);if(!f||diffD(f.date,TODAY)>90){b.none.push(a);return}(f.g<=2?b.poor:f.g===3?b.mid:b.good).push({a,f})});
  b.poor.sort((x,y)=>x.f.g-y.f.g);return b;
}
function famDueCheck(list){
  // only nag about FAMACHA checks on farms that actually record them
  if(!recsOf('weigh').some(w=>Object.values(w.entries||{}).some(e=>e&&e.fam!=null)))return [];
  return list.filter(a=>classGroup(a)!=='young'&&(()=>{const f=famLatest(a._id);return !f||diffD(f.date,TODAY)>30})());
}

/* ============ LABELS ============ */
const PRESET_LABELS=['Stud','Breeding Doe','Elite','Show','Replacement','Cull Candidate','For Sale','Top Performer','Young Stock','Foundation Doe','Foundation Buck','Keep'];
function allLabels(){const s=S.recs.get('settings');const base=s&&Array.isArray(s.labels)?s.labels:PRESET_LABELS;const used=new Set(base);animals().forEach(a=>(a.labels||[]).forEach(l=>used.add(l)));return [...used]}
function labelTone(l){return /^(stud|elite)$/i.test(l||'')?'gold':''}
const labelsOf = a=>Array.isArray(a&&a.labels)?a.labels:[];

/* ============ ALERTS (critical · warning · information) ============ */
function alerts(){return M('alerts:'+S.sp,()=>{
  const out=[];const P=pregs();
  const groups={};P.forEach(p=>{const st=birthState(p);if(['today','open','urgent'].includes(st.key))(groups[p.m._id]=groups[p.m._id]||[]).push(p)});
  const grouped=new Set();
  Object.values(groups).forEach(g=>{if(g.length<3)return;const p=g[0],s=spOf(p.f);g.forEach(x=>grouped.add(x));
    out.push({lvl:'warn',tag:s.birth,text:`${g.length} ${plural(g.length,s.F.toLowerCase())} due to ${s.verb} (${tagOf(A(p.m.male))} group)`,sub:p.from===p.to?`Due ${fmtD(p.from)}`:`Window ${fmtDs(p.from)} – ${fmtD(p.to)}${p.dIn>0?' · starts '+relDays(p.dIn):' · open now'}`,date:p.from,go:{page:'breeding',tab:'due'}})});
  P.forEach(p=>{const s=spOf(p.f),st=birthState(p);if(grouped.has(p))return;
    if(st.key==='overdue')out.push({lvl:'bad',tag:'Overdue',text:`${nameOf(p.f)}: ${s.birth.toLowerCase()} overdue`,sub:`Expected by ${fmtD(p.to)}, ${st.n} ${plural(st.n,'day')} ago. Record the birth or mark her empty.`,date:p.to,go:{page:'animal',id:p.f._id}});
    else if(['today','open','urgent'].includes(st.key))out.push({lvl:'warn',tag:s.birth,text:`${nameOf(p.f)} due to ${s.verb}`,sub:st.key==='urgent'?`Due ${fmtD(p.from)} (${relDays(p.dIn)})`:st.key==='today'?'Due today':`Window open until ${fmtD(p.to)}`,date:p.from,go:{page:'animal',id:p.f._id}});
    else if(st.key==='attention'||st.key==='soon')out.push({lvl:'info',tag:s.birth,text:`${nameOf(p.f)} due to ${s.verb}`,sub:`Due ${fmtD(p.from)} (${relDays(p.dIn)})`,date:p.from,go:{page:'animal',id:p.f._id}});
  });
  const fb=famBuckets(onFarm().filter(inSp));
  fb.poor.forEach(({a,f})=>out.push({lvl:f.g<=1?'bad':'warn',tag:'FAMACHA',text:`${nameOf(a)}: FAMACHA ${f.score} (${FAM_EYE[f.g].s.toLowerCase()})`,sub:`Scored ${fmtD(f.date)}. Check for wireworm and treat if needed.`,date:f.date,go:{page:'animal',id:a._id,tab:'famacha'},fam:f}));
  healthDue().forEach(x=>{const ids=x.ids.filter(id=>inSp(A(id)));if(!ids.length)return;if(x.d>30)return;
    out.push({lvl:x.d< -14?'bad':x.d<=7?'warn':'info',tag:/vacc/i.test(x.h.type)?'Vaccination':'Health',text:`${x.h.product||x.h.type} due for ${ids.length} ${plural(ids.length,'animal')}`,sub:x.d<0?`Overdue since ${fmtD(x.h.next)}`:`Due ${fmtD(x.h.next)} (${relDays(x.d)})`,date:x.h.next,go:{page:'health'}})});
  const wd=withdrawals();const wn=Object.keys(wd).filter(id=>A(id)&&A(id).status==='active'&&inSp(A(id)));
  if(wn.length){const last=wn.map(id=>wd[id].end).sort().pop();out.push({lvl:'warn',tag:'Withdrawal',text:`${wn.length} ${plural(wn.length,'animal')} in withdrawal: do not slaughter`,sub:`Clear by ${fmtD(last)}`,date:TODAY,go:{page:'health',tab:'withdrawal'}})}
  const wean=weighDue().filter(a=>a._why==='wean');
  if(wean.length)out.push({lvl:'info',tag:'Weighing',text:`${wean.length} ${plural(wean.length,'animal')} at weaning age`,sub:'Weigh with the label "Weaning" to get 100-day weights',date:TODAY,go:{page:'weights',pre:wean.map(a=>a._id)}});
  if(S.sp==='all')recsOf('feed').forEach(f=>{const d=feedDaysLeft(f);if(d!=null&&d<14)out.push({lvl:'warn',tag:'Feed',text:`${f.name}: about ${Math.floor(d)} days left`,sub:`${fmtN(feedNow(f))} ${f.unit} on hand at ${fmtN(f.daily,1)} ${f.unit}/day`,date:TODAY,go:{page:'feed'}})});
  recsOf('reminder').filter(r=>!r.done&&validD(r.date)&&diffD(TODAY,r.date)<=7).forEach(r=>{const d=diffD(TODAY,r.date);out.push({lvl:d<=0?'warn':'info',tag:'Reminder',text:r.text,sub:`${fmtD(r.date)} (${relDays(d)})`,date:r.date,rem:r._id})});
  const order={bad:0,warn:1,info:2,ok:3};
  return out.sort((a,b)=>order[a.lvl]-order[b.lvl]||(a.date||'').localeCompare(b.date||''));
})}
function weighDue(){return M('wdue:'+S.sp,()=>{const out=[];onFarm().filter(inSp).forEach(a=>{const d=ageDays(a),s=spOf(a);
  if(d!=null&&d>=s.wean-10&&d<=s.wean+21&&!weightsOf(a._id).some(w=>/wean/i.test(w.label))){out.push(Object.assign({},a,{_why:'wean'}));return}
  const lk=lastKg(a._id);if(classGroup(a)!=='adult'&&(!lk||diffD(lk.date,TODAY)>60))out.push(Object.assign({},a,{_why:'growth'}))});return out})}

/* Today's actions: one clickable line per kind of job */
function todaysActions(){return M('acts:'+S.sp,()=>{
  const out=[],P=pregs(),sc=spScope();const fw=n=>sc?plural(n,sc.F.toLowerCase()):plural(n,'female');
  const over=P.filter(p=>birthState(p).key==='overdue');
  if(over.length)out.push({lvl:'bad',n:over.length,text:`${plural(over.length,'pregnancy','pregnancies')} overdue`,go:{page:'breeding',tab:'overdue'}});
  const wk=P.filter(p=>['today','open','urgent'].includes(birthState(p).key));
  if(wk.length){const p=wk[0],s=spOf(p.f);out.push({lvl:'warn',n:wk.length,text:wk.length===1?`${s.F.toLowerCase()} due to ${s.verb} ${p.dIn>0?'in '+p.dIn+' '+plural(p.dIn,'day'):'now'}`:`${fw(wk.length)} due to give birth within 7 days`,go:wk.length===1?{page:'animal',id:p.f._id}:{page:'breeding',tab:'due'}})}
  const fb=famBuckets(onFarm().filter(inSp));
  if(fb.poor.length)out.push({lvl:fb.poor.some(x=>x.f.g<=1)?'bad':'warn',n:fb.poor.length,text:`${plural(fb.poor.length,'animal')} with poor FAMACHA (pale eyelids)`,go:{page:'herd',ids:fb.poor.map(x=>x.a._id),idsLabel:'Poor FAMACHA'}});
  const fc=famDueCheck(onFarm().filter(inSp));
  if(fc.length){const w=sc?plural(fc.length,sc.one.toLowerCase(),sc.label.toLowerCase()):plural(fc.length,'animal');out.push({lvl:'info',n:fc.length,text:`${w} due for a FAMACHA check`,act:'famCheck',ids:fc.map(a=>a._id)})}
  const hd=healthDue().map(x=>({x,ids:x.ids.filter(id=>inSp(A(id)))})).filter(y=>y.ids.length);
  const hOver=hd.filter(y=>y.x.d<0),hSoon=hd.filter(y=>y.x.d>=0&&y.x.d<=7);
  if(hOver.length){const n=new Set(hOver.flatMap(y=>y.ids)).size;out.push({lvl:'warn',n,text:`${plural(n,'animal')} overdue for health treatment`,go:{page:'health',tab:'due'}})}
  if(hSoon.length){const vac=hSoon.filter(y=>/vacc/i.test(y.x.h.type));out.push({lvl:'info',n:hSoon.length,text:vac.length===hSoon.length?`${plural(hSoon.length,'vaccination')} due this week`:`${plural(hSoon.length,'treatment')} due this week`,go:{page:'health',tab:'due'}})}
  const wd=weighDue();if(wd.length)out.push({lvl:'info',n:wd.length,text:`${plural(wd.length,'animal')} ready for weighing`,act:'weighIds',ids:wd.map(a=>a._id)});
  if(S.sp==='all'){const low=recsOf('feed').filter(f=>{const d=feedDaysLeft(f);return d!=null&&d<14});if(low.length)out.push({lvl:'warn',n:low.length,text:`${plural(low.length,'feed item')} running low`,go:{page:'feed'}})}
  const rem=recsOf('reminder').filter(r=>!r.done&&validD(r.date)&&r.date<=TODAY);if(rem.length)out.push({lvl:'warn',n:rem.length,text:`${plural(rem.length,'reminder')} due`,go:{page:'home'}});
  return out;
})}

/* Attention required: individual animals that need you now */
function attention(){return M('attn:'+S.sp,()=>{
  const out=[];
  pregs().forEach(p=>{const st=birthState(p);if(st.key==='overdue')out.push({lvl:'bad',head:'Overdue',a:p.f,line:`Expected ${fmtDs(p.to)} · ${st.n} ${plural(st.n,'day')} late`,go:{page:'animal',id:p.f._id}});else if(st.key==='today')out.push({lvl:'bad',head:'Due today',a:p.f,line:`${spOf(p.f).birth} expected today`,go:{page:'animal',id:p.f._id}})});
  famBuckets(onFarm().filter(inSp)).poor.forEach(({a,f})=>out.push({lvl:f.g<=1?'bad':'warn',head:'FAMACHA alert',a,line:`Score ${f.score} · ${FAM_EYE[f.g].s} · ${fmtDs(f.date)}`,fam:f,go:{page:'animal',id:a._id,tab:'famacha'}}));
  healthDue().forEach(x=>{if(x.d>0)return;const ids=x.ids.filter(id=>inSp(A(id)));if(!ids.length)return;out.push({lvl:x.d< -14?'bad':'warn',head:'Health due',a:ids.length===1?A(ids[0]):null,count:ids.length,line:`${x.h.product||x.h.type} ${x.d===0?'due today':'overdue '+(-x.d)+' '+plural(-x.d,'day')}`,go:ids.length===1?{page:'animal',id:ids[0],tab:'health'}:{page:'health',tab:'due'}})});
  const o={bad:0,warn:1};return out.sort((a,b)=>o[a.lvl]-o[b.lvl]);
})}

/* Recent activity, newest first */
function activity(n){return M('act:'+S.sp+':'+n,()=>{
  const ev=[];const one=ids=>ids.length===1?A(ids[0]):null;
  recsOf('weigh').forEach(w=>{const ids=Object.keys(w.entries||{}).filter(id=>inSp(A(id)));if(!ids.length)return;const kg=ids.filter(id=>w.entries[id].kg!=null).length,fm=ids.filter(id=>w.entries[id].fam!=null).length;const a=one(ids);
    ev.push({date:w.date,t:w.updated,icon:'scale',text:a?`${tagOf(a)} ${kg?'weighed':'FAMACHA recorded'}${kg&&fm?' + FAMACHA':''}`:`${ids.length} animals ${kg?'weighed':'FAMACHA-scored'} · ${w.label||'session'}`,go:a?{page:'animal',id:a._id,tab:'weights'}:{page:'weights'}})});
  recsOf('mating').forEach(m=>{const fs=matingFemales(m).filter(id=>inSp(A(id)));if(!fs.length)return;const a=one(fs);ev.push({date:m.date,t:m.updated,icon:'heart',text:a?`${tagOf(a)} mated to ${tagOf(A(m.male))}`:`${fs.length} females joined with ${tagOf(A(m.male))}`,go:a?{page:'animal',id:a._id,tab:'breeding'}:{page:'breeding',tab:'matings'}})});
  recsOf('birth').forEach(b=>{const d=A(b.dam);if(!inSp(d))return;ev.push({date:b.date,t:b.updated,icon:'heart',text:`${tagOf(d)} gave birth to ${b.born} (${b.alive} alive)`,go:{page:'animal',id:d._id,tab:'births'}})});
  recsOf('health').forEach(h=>{const ids=(h.animals||[]).filter(id=>inSp(A(id)));if(!ids.length)return;const a=one(ids);ev.push({date:h.date,t:h.updated,icon:'health',text:`${h.type}${h.product?': '+h.product:''} · ${a?tagOf(a):ids.length+' animals'}`,go:a?{page:'animal',id:a._id,tab:'health'}:{page:'health',tab:'records'}})});
  animals().filter(a=>inSp(a)&&a.status!=='ref').forEach(a=>{
    if(a.origin==='bought'&&validD(a.purchaseDate))ev.push({date:a.purchaseDate,t:a.updated,icon:'herd',text:`${tagOf(a)} bought in`,go:{page:'animal',id:a._id}});
    else if(validD(a.created)&&!(validD(a.dob)&&a.created===a.dob)&&a.created>=addD(TODAY,-90))ev.push({date:a.created,t:a.updated,icon:'herd',text:`${tagOf(a)} added to the register`,go:{page:'animal',id:a._id}});
    if(a.status!=='active'&&validD(a.statusDate))ev.push({date:a.statusDate,t:a.updated,icon:'herd',text:`${tagOf(a)} ${({sold:'sold',dead:'died',slaughtered:'slaughtered',culled:'culled',missing:'reported missing'})[a.status]||a.status}`,go:{page:'animal',id:a._id}});
  });
  return ev.filter(e=>e.date<=TODAY).sort((a,b)=>b.date.localeCompare(a.date)||(b.t||'').localeCompare(a.t||'')).slice(0,n);
})}

/* ============ CALENDAR ============ */
function upcoming(days){
  const end=addD(TODAY,days),ev=[];
  const byM={};pregs().forEach(p=>{if(p.from<=end&&p.to>=addD(TODAY,-7))(byM[p.m._id]=byM[p.m._id]||[]).push(p)});
  Object.values(byM).forEach(g=>{const p=g[0],s=spOf(p.f);if(g.length>=3)ev.push({date:p.from<TODAY?TODAY:p.from,text:`${s.birth}: ${g.length} ${plural(g.length,s.F.toLowerCase())} (${tagOf(A(p.m.male))} group)`,kind:'birth',go:{page:'breeding',tab:'due'}});else g.forEach(p=>ev.push({date:p.from<TODAY?TODAY:p.from,text:`${s.birth}: ${nameOf(p.f)}`,kind:'birth',go:{page:'animal',id:p.f._id}}))});
  healthDue().forEach(x=>{if(x.h.next<=end&&x.ids.some(id=>inSp(A(id))))ev.push({date:x.h.next,text:`${x.h.product||x.h.type} · ${x.ids.length} ${plural(x.ids.length,'animal')}`,kind:'health',go:{page:'health'}})});
  Object.entries(withdrawals()).forEach(([id,w])=>{const a=A(id);if(a&&a.status==='active'&&inSp(a)&&w.end<=end)ev.push({date:w.end,text:`Withdrawal ends: ${nameOf(a)}`,kind:'wd',go:{page:'animal',id}})});
  recsOf('reminder').filter(r=>!r.done&&validD(r.date)&&r.date<=end).forEach(r=>ev.push({date:r.date<TODAY?TODAY:r.date,text:r.text,kind:'rem',rem:r._id}));
  return ev.sort(byDate);
}

/* ============ STOCK RECONCILIATION ============ */
function entryDate(a){return a.origin==='bought'&&validD(a.purchaseDate)?a.purchaseDate:validD(a.dob)?a.dob:validD(a.created)?a.created:'1900-01-01'}
function onFarmAt(a,date){if(a.status==='ref')return false;if(entryDate(a)>date)return false;if(a.status!=='active'&&validD(a.statusDate)&&a.statusDate<=date)return false;return true}
function reconcile(from,to,sp){
  const list=animals().filter(a=>a.status!=='ref'&&(sp==='all'||a.species===sp));
  const r={open:0,born:0,bought:0,sold:0,dead:0,slaughtered:0,culled:0,missing:0,close:0};
  list.forEach(a=>{
    if(onFarmAt(a,addD(from,-1)))r.open++;
    const e=entryDate(a);if(e>=from&&e<=to){if(a.origin==='bought')r.bought++;else r.born++}
    if(a.status!=='active'&&validD(a.statusDate)&&a.statusDate>=from&&a.statusDate<=to&&r[a.status]!=null)r[a.status]++;
    if(onFarmAt(a,to))r.close++;
  });
  return r;
}

function niceTicks(min,max,n){if(min===max){min-=1;max+=1}const span=max-min,step0=span/n,mag=Math.pow(10,Math.floor(Math.log10(step0))),f=step0/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return t}
function lineChart(points,opt){

  <path d="${area}" fill="var(--forest-2)" fill-opacity=".08"/>
  <path d="${path}" fill="none" stroke="var(--forest-2)" stroke-width="2.2" stroke-linejoin="round"/>
  ${points.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.v)}" r="3" fill="var(--surface)" stroke="var(--forest-2)" stroke-width="2"><title>${fmtD(p.date)}: ${fmtN(p.v,1)} ${opt.unit||''}</title></circle>`).join('')}

let gIdx=0,gHits=[];
function searchAnimals(q){
  q=q.trim().toLowerCase();if(!q)return [];const qn=q.replace(/[\s\-_]/g,'');
  const score=a=>{const tag=(a.tag||'').toLowerCase(),tn=tag.replace(/[\s\-_]/g,'');
    if(tag===q||tn===qn)return 0;if(tag.startsWith(q)||tn.startsWith(qn))return 1;if((a.name||'').toLowerCase().startsWith(q))return 2;
    if(tn.includes(qn))return 3;
    const hay=[a.name,a.breed,a.rfid,a.officialId,a.studNo,a.camp,...labelsOf(a)].filter(Boolean).join(' ').toLowerCase();
    return hay.includes(q)?4:99};
  return animals().map(a=>({a,s:score(a)})).filter(x=>x.s<99).sort((x,y)=>x.s-y.s||(x.a.status==='active'?0:1)-(y.a.status==='active'?0:1)||(x.a.tag||'').localeCompare(y.a.tag||'',undefined,{numeric:true})).slice(0,12).map(x=>x.a);
}

}

const COLS=[['tag','Tag'],['name','Name'],['species','Species'],['breed','Breed'],['sex','Sex'],['age','Age'],['status','Status'],['preg','Pregnancy'],['fam','FAMACHA'],['weight','Weight'],['camp','Camp'],['labels','Tags'],['official','Official ID'],['rfid','RFID'],['coi','COI'],['value','Value']];
const COLS_DEFAULT=['tag','name','species','breed','sex','age','status','preg','fam','weight','camp','labels'];
function visCols(){if(!S.cols){let c=null;try{c=JSON.parse(localStorage.getItem('ssm_cols_v1')||'null')}catch(e){}S.cols=Array.isArray(c)?c:COLS_DEFAULT.slice()}return S.cols}
function pregOf(a){return pregnancies().find(p=>p.f._id===a._id)||null}
function herdFiltered(){
  const f=S.f,q=f.q.trim().toLowerCase();const ids=f.ids?new Set(f.ids):null;
  let l=animals().filter(a=>{
    if(ids)return ids.has(a._id)&&inSp(a);
    if(!inSp(a))return false;
    if(f.status==='active'&&a.status!=='active')return false;
    if(f.status==='gone'&&(a.status==='active'||a.status==='ref'))return false;
    if(f.status==='ref'&&a.status!=='ref')return false;
    if(f.status==='all_but_ref'&&a.status==='ref')return false;
    if(f.sex!=='all'&&a.sex!==f.sex)return false;
    if(f.camp!=='all'&&(a.camp||'')!==f.camp)return false;
    if(f.breed!=='all'&&(a.breed||'')!==f.breed)return false;
    if(f.label!=='all'&&!labelsOf(a).includes(f.label))return false;
    if(f.cls!=='all'){const g=classGroup(a);if(f.cls==='breeding'){if(!(g==='adult'&&a.sex!=='C'))return false}else if(f.cls==='pregnant'){if(!pregnantIds().has(a._id))return false}else if(g!==f.cls)return false}
    if(q&&!`${a.tag} ${a.name||''} ${a.breed||''} ${a.studNo||''} ${a.officialId||''} ${a.rfid||''} ${labelsOf(a).join(' ')}`.toLowerCase().includes(q))return false;
    return true;
  });
  const key={tag:a=>a.tag||'',name:a=>a.name||'~',species:a=>a.species,breed:a=>a.breed||'~',sex:a=>a.sex,age:a=>a.dob||'9999',status:a=>a.status,
    preg:a=>{const p=pregOf(a);return p?p.dIn:1e6},fam:a=>{const f=famLatest(a._id);return f?f.g:9},weight:a=>-(lastKg(a._id)||{kg:-1}).kg,camp:a=>a.camp||'~',labels:a=>labelsOf(a).join(',')||'~',
    official:a=>a.officialId||'~',rfid:a=>a.rfid||'~',coi:a=>-coi(a),value:a=>-(valueOf(a)||0)}[f.sort]||(a=>a.tag||'');
  return l.sort((x,y)=>{const a=key(x),b=key(y);const r=typeof a==='number'?a-b:String(a).localeCompare(String(b),undefined,{numeric:true});return r*f.dir});
}
function herdCell(c,a){
  switch(c){
    case 'tag':return `<td class="stick nw">${tagChip(a)}</td>`;
    case 'name':return `<td><b>${esc(a.name||'—')}</b><div class="small muted">${esc(ageClass(a))}</div></td>`;
    case 'species':return `<td class="nw">${spBadge(a)}</td>`;
    case 'breed':return `<td class="small">${esc(a.breed||'—')}${(a.regType||'').startsWith('Stud')?' <span class="lchip gold">Reg.</span>':''}</td>`;
    case 'sex':return `<td class="nw">${sexMark(a)} <span class="small">${esc(sexWord(a))}</span></td>`;
    case 'age':return `<td class="nw tnum">${ageText(ageDays(a))}</td>`;
    case 'status':return `<td>${statusPill(a)}</td>`;
    case 'preg':{const p=a.status==='active'&&pregOf(a);if(!p)return '<td class="muted">—</td>';const st=birthState(p);return `<td class="nw small" style="${['overdue','today','open','urgent'].includes(st.key)?'color:var(--bad);font-weight:650':''}">${st.key==='overdue'?'Overdue '+st.n+' d':st.key==='today'?'Due today':st.key==='open'?'Window open':st.n+' d · '+fmtDs(p.from)}</td>`}
    case 'fam':{const f=famLatest(a._id);return `<td class="nw">${f?famChip(f.score,{label:false})+` <span class="small muted">${fmtDs(f.date)}</span>`:'<span class="muted">—</span>'}</td>`}

    case 'value':{const v=valueOf(a);return `<td class="r nw">${v!=null?money(v):'—'}</td>`}
  }return '<td></td>';
}

  else if(tab==='groups'){const ms=recsOf('mating').filter(m=>matingFemales(m).length>1&&matingFemales(m).some(id=>inSp(A(id)))).sort(byDate).reverse();
    body=ms.length?`<div class="grid g2">${ms.map(m=>{const fs=matingFemales(m).map(A).filter(Boolean),w=dueWindow(m,fs[0]);let born=0,pr=0,empt=0,wait=0;fs.forEach(f=>{const b=birthsOf(f._id).find(x=>diffD(w.from,x.date)>=-35&&diffD(w.to,x.date)<=35);const sc=scanFor(m._id,f._id);if(b)born++;else if(sc==='empty')empt++;else if(pregnancies().some(p=>p.m===m&&p.f===f)){pr++}else wait++});return `<div class="card"><div class="card-h"><div><h3>${esc(tagOf(A(m.male)))} · ${esc(m.method||'')}</h3><div class="sub">${fmtD(m.date)}${validD(m.end)?' – '+fmtD(m.end):''} · due ${fmtDs(w.from)}${w.from!==w.to?' – '+fmtD(w.to):''}</div></div><button class="btn sm ghost" data-act="scanForm" data-id="${m._id}">Scan</button></div>
      <dl class="kv"><dt>Given birth</dt><dd>${born}</dd><dt>Pregnant</dt><dd>${pr}</dd><dt>Scanned empty</dt><dd>${empt}</dd><dt>No result yet</dt><dd>${wait}</dd></dl>

  else if(tab==='females'){
    const fs=animals().filter(a=>inSp(a)&&a.sex==='F'&&a.status==='active'&&breedingAge(a)).map(f=>{const b=birthsOf(f._id),off=offspringOf(f._id).filter(o=>o.dam===f._id),w=off.map(wean100).filter(Boolean).map(x=>x.adj);return {f,b,born:sum(b,x=>num(x.born)),alive:sum(b,x=>num(x.alive)),weaned:off.filter(o=>{const d=ageDays(o),s=spOf(o);return (d!=null&&d>=s.wean&&o.status!=='dead')||(o.status==='dead'&&validD(o.statusDate)&&diffD(o.dob,o.statusDate)>=s.wean)}).length,ki:kiddingInterval(f._id),w100:w.length?sum(w)/w.length:null,last:b.length?b[b.length-1].date:null,assist:b.filter(x=>x.ease&&!/unassisted|slight/i.test(x.ease)).length}}).sort((x,y)=>(y.w100||0)*(y.weaned||0)-(x.w100||0)*(x.weaned||0));
    body=fs.length?`<div class="tablewrap"><table class="t"><thead><tr><th>Female</th><th>Age</th><th class="r">Births</th><th class="r">Born</th><th class="r">Alive</th><th class="r">Weaned</th><th class="r">Interval (d)</th><th class="r">Avg 100-day wt</th><th>Last birth</th><th></th></tr></thead><tbody>${fs.map(x=>{const open=x.last?diffD(x.last,TODAY):null;return `<tr class="click" data-act="open" data-id="${x.f._id}"><td class="nw">${tagChip(x.f)} ${esc(x.f.name||'')}</td><td>${ageText(ageDays(x.f))}</td><td class="r">${x.b.length}</td><td class="r">${x.born}</td><td class="r">${x.alive}</td><td class="r">${x.weaned}</td><td class="r">${x.ki?Math.round(x.ki):'—'}</td><td class="r">${x.w100?fmtN(x.w100,1)+' kg':'—'}</td><td>${x.last?fmtD(x.last):'—'}</td><td>${pregnantIds().has(x.f._id)?'<span class="pill info">Pregnant</span>':open!=null&&open>400?'<span class="pill warn">Open '+open+' d</span>':''}${x.assist>=2?' <span class="pill bad">'+x.assist+' assisted</span>':''}</td></tr>`}).join('')}</tbody></table></div><p class="muted small">Sorted by total weaning weight produced (100-day weight × offspring weaned).</p>`:empty('No breeding-age females on the farm');
  } else {
    const sps=S.sp==='all'?spOn():[S.sp];
    body=`<div class="tablewrap"><table class="t"><thead><tr><th>Species</th><th class="r">Females scanned</th><th class="r">Scanned pregnant</th><th class="r">Births (12 mo)</th><th class="r">Young per birth</th><th class="r">Born alive</th><th class="r">Avg interval</th><th>Ease of birth</th></tr></thead><tbody>${sps.map(k=>{const s=SP[k];
      const scans=recsOf('scan').filter(x=>(A((recsOf('mating').find(m=>m._id===x.mating)||{}).male)||{species:(recsOf('mating').find(m=>m._id===x.mating)||{}).species}).species===k);
      let n=0,p=0;scans.forEach(x=>Object.values(x.results||{}).forEach(r=>{if(!r)return;n++;if(r!=='empty')p++}));
      const b=recsOf('birth').filter(x=>x.date>=y1&&(A(x.dam)||{}).species===k);const ki=animals().filter(a=>a.species===k&&a.sex==='F').map(a=>kiddingInterval(a._id)).filter(Boolean);
      const easy=b.filter(x=>!x.ease||/unassisted|slight/i.test(x.ease)).length;
      return `<tr><td>${spBadge({species:k},s.label)}</td><td class="r">${n}</td><td class="r">${n?`${p} (${Math.round(p/n*100)}%)`:'—'}</td><td class="r">${b.length}</td><td class="r">${b.length?fmtN(sum(b,x=>num(x.born))/b.length,2):'—'}</td><td class="r">${sum(b,x=>num(x.born))?Math.round(sum(b,x=>num(x.alive))/sum(b,x=>num(x.born))*100)+'%':'—'}</td><td class="r">${ki.length?Math.round(sum(ki)/ki.length)+' d':'—'}</td><td>${b.length?`${Math.round(easy/b.length*100)}% unassisted`:'—'}</td></tr>`}).join('')}</tbody></table></div>`;
  }
  return `<div class="pagehead"><div><h1>${sc?sc.one+' breeding':'Breeding'}</h1><div class="sub">Gestation: ${(S.sp==='all'?spOn():[S.sp]).map(k=>`${SP[k].label.toLowerCase()} ${SP[k].gest} d`).join(' · ')}</div></div><div class="row"><button class="btn ghost" data-act="birthForm">Record birth</button><button class="btn" data-act="matingForm">${icon('plus')}Record mating</button></div></div>
  <div class="kpis">${kpi('Pregnant',P.length)}${kpi('Due within 7 days',P.filter(p=>p.dEnd>=0&&p.dIn<=7).length,null,P.some(p=>p.dEnd>=0&&p.dIn<=7)?'warn':'')}${kpi('Due within 30 days',P.filter(p=>p.dEnd>=0&&p.dIn<=30).length)}${kpi('Overdue',over.length,null,over.length?'bad':'',{page:'breeding',tab:'overdue'})}${kpi('Births, 12 months',bs.filter(b=>b.date>=y1).length,sum(bs.filter(b=>b.date>=y1),b=>num(b.born))+' young born')}${kpi(sc?sc.birth+' interval':'Average interval',ints.length?Math.round(sum(ints)/ints.length)+' d':'—','between births')}</div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="vtab" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;
};

/* ---------- WEIGHTS & FAMACHA ---------- */

  else if(tab==='withdrawal')body=wdl.length?`<div class="callout bad" style="margin-bottom:12px">Do not slaughter these animals, or sell them for slaughter, before the date shown.</div><div class="tablewrap"><table class="t"><thead><tr><th>Animal</th><th>Product</th><th>Treated</th><th>Clear on</th><th>Days left</th></tr></thead><tbody>${wdl.sort((a,b)=>b[1].end.localeCompare(a[1].end)).map(([id,w])=>`<tr class="click" data-act="open" data-id="${id}"><td class="nw">${tagChip(A(id))} ${esc(A(id).name||'')}</td><td>${esc(w.product)}</td><td>${fmtD(w.h.date)}</td><td>${fmtD(w.end)}</td><td><span class="pill bad">${diffD(TODAY,w.end)}</span></td></tr>`).join('')}</tbody></table></div>`:empty('No animals in withdrawal','Enter the withdrawal days from the product label when you treat.');

/* ---------- MONEY ---------- */
function txnInSp(t){if(S.sp==='all')return true;if(t.species)return t.species===S.sp;const ids=(t.animals||[]).filter(id=>A(id));return ids.length>0&&ids.every(id=>A(id).species===S.sp)}
VIEWS.money=function(){
  const per=S.view.per||'12m',[from,to]=periodRange(per),sc=spScope();
  const all=recsOf('txn').filter(txnInSp);
  const tx=all.filter(t=>t.date>=from&&t.date<=to).sort(byDate).reverse();
  const inc=sum(tx.filter(t=>t.type==='income'),t=>num(t.amount)),exp=sum(tx.filter(t=>t.type==='expense'),t=>num(t.amount));
  const mk=TODAY.slice(0,7),mt=all.filter(t=>(t.date||'').startsWith(mk));
  const salesM=sum(mt.filter(t=>t.type==='income'&&/sale/i.test(t.category||'')),t=>num(t.amount)),expM=sum(mt.filter(t=>t.type==='expense'),t=>num(t.amount));
  const live=onFarm().filter(inSp),vals=live.map(a=>({a,v:valueOf(a)})).filter(x=>x.v!=null);
  const breed=vals.filter(x=>classGroup(x.a)==='adult'&&x.a.sex!=='C');
  const months=[];const end=parseD(TODAY);for(let i=11;i>=0;i--){const d=new Date(end.getFullYear(),end.getMonth()-i,1);const k=isoD(d).slice(0,7);const m=all.filter(t=>(t.date||'').startsWith(k));months.push({label:d.toLocaleDateString('en-GB',{month:'short'}),inc:sum(m.filter(t=>t.type==='income'),t=>num(t.amount)),exp:sum(m.filter(t=>t.type==='expense'),t=>num(t.amount))})}
  const cats={};tx.forEach(t=>{const k=t.type+'|'+(t.category||'Other');cats[k]=(cats[k]||0)+num(t.amount)});
  const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const days=Math.max(1,diffD(from<'1901'?(tx.length?tx[tx.length-1].date:TODAY):from,to)+1);
  const rc=reconcile(from,to,S.sp==='all'?'all':S.sp),heads=Math.max(1,(rc.open+rc.close)/2);
  return `<div class="pagehead"><div><h1>${sc?sc.one+' finances':'Money'}</h1><div class="sub">Herd value, sales, costs and profit${sc?' · transactions linked to '+sc.label.toLowerCase():''}</div></div><div class="row"><div class="seg">${[['12m','12 months'],['ytd','This year'],['last','Last year'],['all','All']].map(([k,l])=>`<button class="${per===k?'on':''}" data-act="per" data-v="${k}">${l}</button>`).join('')}</div><button class="btn ghost" data-act="expenseForm">${icon('expense')}Expense</button><button class="btn" data-act="incomeForm">${icon('income')}Income</button></div></div>
  <div class="kpis">${kpi('Herd value',vals.length?money(sum(vals,x=>x.v)):'—',vals.length?`${vals.length} of ${live.length} priced`:'<span>Set prices in Settings</span>')}${kpi('Sales this month',money(salesM))}${kpi('Expenses this month',money(expM))}${kpi('Net income',money(inc-exp),{['12m']:'last 12 months',ytd:'this year',last:'last year',all:'all time'}[per],inc-exp<0?'bad':'')}${kpi('Average animal value',vals.length?money(sum(vals,x=>x.v)/vals.length):'—')}${kpi('Breeding stock value',breed.length?money(sum(breed,x=>x.v)):'—',breed.length+' breeding adults')}</div>
  <div class="split mt"><div class="card"><div class="card-h"><h2>Income and expenses</h2><span class="muted small">Last 12 months</span></div>${barChart(months)}</div>
  <div class="card"><div class="card-h"><h2>Profit summary</h2></div><dl class="kv"><dt>Income</dt><dd style="color:var(--ok)">${money(inc)}</dd><dt>Expenses</dt><dd>${money(exp)}</dd><dt><b>Net</b></dt><dd><b>${money(inc-exp)}</b></dd><dt>Cost per head per day</dt><dd>${money(exp/heads/days,2)}</dd></dl>
  <h3 style="margin:16px 0 8px">By category</h3>${catRows.length?`<dl class="kv">${catRows.map(([k,v])=>{const [t,c]=k.split('|');return `<dt><span class="pill ${t==='income'?'ok':''}" style="margin-right:6px">${t==='income'?'In':'Out'}</span>${esc(c)}</dt><dd>${money(v)}</dd>`}).join('')}</dl>`:'<p class="muted">No transactions in this period.</p>'}
  ${sc?'<p class="muted small">Expenses not linked to a species (shared feed, labour) appear under All.</p>':''}</div></div>
  <div class="card mt">${saleCalc()}</div>

    const s=SP[k];const ms=recsOf('mating').filter(m=>m.date>=addD(from,-s.gest)&&m.date<=addD(to,-s.gest)&&(A(m.male)||{species:m.species}).species===k);
    const joined=new Set();ms.forEach(m=>matingFemales(m).forEach(f=>joined.add(f)));
    const bs=recsOf('birth').filter(b=>b.date>=from&&b.date<=to&&(A(b.dam)||{}).species===k);

    const preDead=kids.filter(a=>a.status==='dead'&&validD(a.statusDate)&&diffD(a.dob,a.statusDate)<s.wean).length;

  });

  // FAMACHA trend: share of pale scores per month, last 6 months
  const fm=[];const end=parseD(TODAY);for(let i=5;i>=0;i--){const d=new Date(end.getFullYear(),end.getMonth()-i,1),k=isoD(d).slice(0,7);const c=[0,0,0,0,0,0];recsOf('weigh').filter(w=>(w.date||'').startsWith(k)).forEach(w=>Object.entries(w.entries||{}).forEach(([id,e])=>{const a=A(id);if(e&&e.fam!=null&&a&&sps.includes(a.species)){c[famGrade(e.fam)]++}}));fm.push({label:d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}),c,n:sum(c)})}

  const hh=recsOf('health').filter(h=>h.date>=from&&h.date<=to&&(h.animals||[]).some(id=>sps.includes((A(id)||{}).species)));const ht={};hh.forEach(h=>{ht[h.type]=ht[h.type]||{n:0,a:0,c:0};ht[h.type].n++;ht[h.type].a+=(h.animals||[]).length;ht[h.type].c+=num(h.cost)});
  const culls=onFarm().filter(a=>sps.includes(a.species)).map(a=>{const r=[];
    if(a.sex==='F'&&ageDays(a)>=730){const b=birthsOf(a._id);const last=b.length?b[b.length-1].date:null;if(!pregnantIds().has(a._id)&&(!last||diffD(last,TODAY)>400))r.push(last?`No birth for ${diffD(last,TODAY)} days`:'Never given birth');
      if(b.filter(x=>x.ease&&!/unassisted|slight/i.test(x.ease)).length>=2)r.push('Repeated assisted births');}
    if(famHigh(a._id)>=2)r.push(`Pale FAMACHA on ${famHigh(a._id)} occasions`);
    const bc=lastScore(a._id,'bcs');if(bc&&bc.bcs<=1.5&&diffD(bc.date,TODAY)<=90)r.push('Body condition '+bc.bcs);
    if(!a.teeth&&ageDays(a)>=2555&&a.sex!=='M')r.push('Aged: 7+ years, check teeth');if(a.teeth==='Broken mouth'||a.teeth==='Gummy')r.push('Teeth: '+a.teeth.toLowerCase());

  <div class="card mt">${H('Stock reconciliation','Opening + in − out = closing')}<div class="tablewrap"><table class="t"><thead><tr><th>Species</th><th class="r">Opening</th><th class="r">Born</th><th class="r">Bought</th><th class="r">Sold</th><th class="r">Died</th><th class="r">Slaughtered</th><th class="r">Culled</th><th class="r">Missing / stolen</th><th class="r">Closing</th></tr></thead><tbody>

  <div class="card mt">${H('Breeding & birth performance','Births in period; joined = females mated one gestation earlier')}<div class="tablewrap"><table class="t"><thead><tr><th>Species</th><th class="r">Females joined</th><th class="r">Births</th><th class="r">Young born</th><th class="r">Young per female joined</th><th class="r">Born alive</th><th class="r">Avg birth wt</th><th class="r">Unassisted</th><th class="r">Died before weaning</th><th class="r">Weaned</th></tr></thead><tbody>

  <div class="split even mt"><div class="card">${H('Financial summary',fmtD(from)+' – '+fmtD(to))}<dl class="kv"><dt>Sales</dt><dd>${money(sales)}</dd><dt>Total income</dt><dd style="color:var(--ok)">${money(inc)}</dd><dt>Expenses</dt><dd>${money(exp)}</dd><dt><b>Profit</b></dt><dd><b style="color:${inc-exp<0?'var(--bad)':'inherit'}">${money(inc-exp)}</b></dd><dt>Herd value today</dt><dd>${money(sum(summary,x=>x.t.value))}</dd></dl>
</div><div class="card">${H('Health history',fmtD(from)+' – '+fmtD(to))}${Object.keys(ht).length?`<dl class="kv">${Object.entries(ht).sort((a,b)=>b[1].n-a[1].n).map(([t,v])=>`<dt>${esc(t)}</dt><dd>${v.n} ${plural(v.n,'record')} · ${v.a} animal-treatments${v.c?' · '+money(v.c):''}</dd>`).join('')}</dl>`:'<p class="muted">No treatments in this period.</p>'}</div></div>

/* ============ KEPT VIEWS (pedigree, studbook, feed, calculators) ============ */
function pbox(id,ext,sex,self){
  const a=A(id);
  if(!a)return `<div class="pbox unk ${sex}"><div class="pn">${esc(ext||'Unknown')}</div><div class="pm">${ext?'Not in register':'Not recorded'}</div></div>`;
  return `<div class="pbox ${a.sex==='M'?'M':'F'}${self?' self':''}" data-act="open" data-id="${a._id}"><div class="pn">${esc(tagOf(a))}${a.name?' · '+esc(a.name):''}</div><div class="pm">${esc([a.breed,a.studNo,validD(a.dob)?parseD(a.dob).getFullYear():''].filter(Boolean).join(' · ')||'—')}</div></div>`;
}
function pedigreeTree(a){
  const gen=[[{id:a._id}]];
  for(let g=1;g<4;g++){gen[g]=[];gen[g-1].forEach(n=>{const x=A(n.id);gen[g].push({id:x&&x.sire,ext:x?x.sireExt:'',sex:'M'},{id:x&&x.dam,ext:x?x.damExt:'',sex:'F'})})}
  const heads=['Animal','Parents','Grandparents','Great-grandparents'];
  // a slot whose child is unknown stays empty, so the tree only shows real branches
  const known=[[true]];for(let g=1;g<4;g++){known[g]=[];gen[g-1].forEach((n,i)=>{const ok=known[g-1][i]&&!!A(n.id);known[g].push(ok,ok)})}
  let cells=heads.map((h,g)=>`<div class="eyebrow" style="grid-column:${g+1};grid-row:1">${h}</div>`).join('');
  gen.forEach((col,g)=>{const span=8/col.length;col.forEach((n,i)=>{const pos=`grid-column:${g+1};grid-row:${2+i*span} / span ${span}`;cells+=known[g][i]?`<div class="pslot" style="${pos}">${pbox(n.id,n.ext,n.sex,g===0)}</div>`:`<div style="${pos}"></div>`})});
  return `<div class="pedwrap"><div class="ped">${cells}</div></div>`;
}
function profPedigree(a){
  const c=coi(a),ca=a.sire&&a.dam?commonAncestors(a.sire,a.dam):[];
  const sibs=animals().filter(x=>x._id!==a._id&&((a.sire&&x.sire===a.sire)||(a.dam&&x.dam===a.dam)));
  return `<div class="card"><div class="card-h"><h2>Pedigree</h2><div class="row"><span class="coi"><b class="tnum">${pct(c)}</b><span class="muted">inbreeding</span></span><span class="pill ${coiLevel(c)}">${c>=0.125?'High':c>=0.0625?'Moderate':'Low'}</span></div></div>
    ${pedigreeTree(a)}
    ${ca.length?`<div class="callout warn mt">Sire and dam share ancestors: ${ca.map(id=>esc(nameOf(A(id)))).join(', ')}.</div>`:''}
    <p class="muted small mt">Click any box to open that animal. To record ancestors that never lived on your farm (a stud sire, an AI buck), add them as animals with status “Ancestor (not on farm)”. They count for COI but not in your stock numbers.</p></div>
  <div class="card mt"><h2 style="margin-bottom:10px">Siblings (${sibs.length})</h2>${sibs.length?`<div class="row">${sibs.map(x=>`<button class="btn ghost sm" data-act="open" data-id="${x._id}">${esc(nameOf(x))} <span class="muted">${x.sire===a.sire&&x.dam===a.dam?'full':'half'}</span></button>`).join('')}</div>`:'<p class="muted" style="margin:0">None recorded.</p>'}</div>`;
}
function profHealth(a){
  const h=healthOf(a._id);const w=withdrawals()[a._id];
  return `${w?`<div class="callout bad" style="margin-bottom:12px"><b>In withdrawal until ${fmtD(w.end)}</b> after ${esc(w.product)}. Do not slaughter or sell for slaughter before then.</div>`:''}
  <div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Type</th><th>Product</th><th>Dose / route</th><th>Withdrawal</th><th>Next due</th><th>By</th></tr></thead><tbody>
  ${h.length?h.map(x=>`<tr class="click" data-act="healthForm" data-hid="${x._id}"><td>${fmtD(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.product||'—')}</td><td>${esc([x.dose,x.route].filter(Boolean).join(' · ')||'—')}</td><td>${num(x.withdrawal)?esc(x.withdrawal)+' d → '+fmtDs(addD(x.date,num(x.withdrawal))):'—'}</td><td>${fmtD(x.next)}</td><td>${esc(x.by||'—')}</td></tr>`).join(''):`<tr><td colspan="7">${empty('No health records')}</td></tr>`}
  </tbody></table></div>`;
}

  } else if(mal){

    planner=`<div class="tablewrap mt"><table class="t"><thead><tr><th>Female</th><th>Breed</th><th class="r">Offspring COI</th><th>Relationship</th></tr></thead><tbody>${fs.map(({f,c})=>`<tr class="click" data-act="open" data-id="${f._id}"><td>${tagChip(f)} ${esc(f.name||'')}</td><td>${esc(f.breed||'')}</td><td class="r"><span class="pill ${coiLevel(c)}">${pct(c)}</span></td><td class="small">${esc(relation(mal,f))}</td></tr>`).join('')}</tbody></table></div><p class="muted small">Sorted with the riskiest pairings first, so you can keep these females away from him.</p>`;
  }
  const reg=all.filter(a=>a.studNo||(a.regType||'').startsWith('Stud'));

function relation(m,f){
  if(f.sire===m._id)return 'Her sire';if(m.dam===f._id)return 'His dam';
  if(m.sire&&m.sire===f.sire&&m.dam&&m.dam===f.dam)return 'Full siblings';
  if((m.sire&&m.sire===f.sire)||(m.dam&&m.dam===f.dam))return 'Half siblings';
  const fs=A(f.sire),fd=A(f.dam);if((fs&&(fs.sire===m._id||fs.dam===m._id))||(fd&&(fd.sire===m._id)))return 'Her grandsire';
  const ca=commonAncestors(m._id,f._id);return ca.length?'Share '+ca.length+' '+plural(ca.length,'ancestor'):'Unrelated (as recorded)';
}

/* ============ KIDS & LAMBS ============ */
const target = sp=>{const t=(settings().targets||{})[sp]||{};const d=DEFAULT_SETTINGS.targets[sp]||{sale:35,saleAge:240};return {sale:num(t.sale)||d.sale,saleAge:num(t.saleAge)||d.saleAge}};
/* growth model for one young animal: everything is "at its current growth rate" */
function growth(a){
  return M('gr:'+a._id,()=>{
    const ks=kgsOf(a._id),lk=ks.length?ks[ks.length-1]:null,bw=birthWt(a),age=ageDays(a);
    let rate=null,basis='';
    if(ks.length>=2){const p=ks[ks.length-2];const d=diffD(p.date,lk.date);if(d>=5){rate=(lk.kg-p.kg)/d;basis='recent'}}
    if(rate==null&&lk&&bw!=null&&validD(a.dob)){const d=diffD(a.dob,lk.date);if(d>=5){rate=(lk.kg-bw)/d;basis='since birth'}}
    if(rate!=null&&rate<0)rate=0;
    const lkAge=lk&&validD(a.dob)?diffD(a.dob,lk.date):null;
    const at=ageD=>lk&&rate!=null&&lkAge!=null?Math.max(lk.kg,lk.kg+rate*(ageD-lkAge)):null;
    const t=target(a.species);
    let w100=wean100(a),w100proj=false;
    if(!w100&&age!=null&&age<100&&at(100)!=null){w100={adj:at(100)};w100proj=true}
    let hit=null;
    if(lk&&lk.kg>=t.sale)hit={date:lk.date,done:true};
    else if(lk&&rate>0&&validD(a.dob)){const days=Math.ceil((t.sale-lk.kg)/rate);const dt=addD(lk.date,days);if(diffD(TODAY,dt)<=730)hit={date:dt,done:false,ageDays:diffD(a.dob,dt)}}
    const stale=lk?diffD(lk.date,TODAY):null;
    return {lk,bw,age,rate,basis,at,w100,w100proj,hit,t,stale,adgG:rate!=null?rate*1000:null};
  });
}
function youngList(){
  return M('young:'+S.sp,()=>onFarm().filter(a=>inSp(a)&&validD(a.dob)&&ageDays(a)<365));
}
function youngFlags(a,g,avg){
  const f=[];
  if(!g.lk)f.push('Not weighed');
  else if(g.stale>45)f.push(`Last weighed ${g.stale} d ago`);
  const ref=avg&&typeof avg==='object'?avg[a.species+'|'+classGroup(a)]:avg;
  if(g.adgG!=null&&ref&&g.adgG<ref*0.7)f.push('Growing slowly');
  return f;
}
function growthChart(list){
  /* weight against age, with the target line from birth to target sale weight */
  const pts=list.map(a=>{const g=growth(a);return g.lk&&validD(a.dob)?{a,x:diffD(a.dob,g.lk.date),y:g.lk.kg}:null}).filter(Boolean);
  if(pts.length<2)return '<div class="empty small">Weigh your young stock to see the growth chart.</div>';
  const sps=[...new Set(list.map(a=>a.species))];const t=target(sps.length===1?sps[0]:'goat');
  const W=760,H=260,L=40,R=16,T=12,B=30;const xMax=Math.max(365,...pts.map(p=>p.x));const yMax=Math.max(t.sale*1.15,...pts.map(p=>p.y))*1.05;
  const X=v=>L+v/xMax*(W-L-R),Y=v=>T+(1-v/yMax)*(H-T-B);
  const yt=niceTicks(0,yMax,4).filter(v=>v<=yMax),xt=[0,100,180,270,365].filter(v=>v<=xMax);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight against age">
  ${yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtN(v)}</text>`).join('')}
  ${xt.map(v=>`<text x="${X(v)}" y="${H-10}" text-anchor="middle">${v===0?'Birth':v+' d'}</text>`).join('')}
  <line x1="${X(0)}" y1="${Y(bwAvg)}" x2="${X(t.saleAge)}" y2="${Y(t.sale)}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="${X(t.saleAge)+6}" y="${Y(t.sale)+4}" style="fill:var(--ink);font-weight:600">Target ${t.sale} kg</text>
  ${pts.map(p=>{const g=growth(p.a);const slow=youngFlags(p.a,g,null).length;return `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${p.a.species==='sheep'?'var(--sage)':'var(--forest-2)'}" fill-opacity=".85" data-act="open" data-id="${p.a._id}" style="cursor:pointer"><title>${esc(tagOf(p.a))}: ${fmtN(p.y,1)} kg at ${p.x} days</title></circle>`}).join('')}
  </svg>${sps.length>1?'<div class="legend"><span><i style="background:var(--forest-2)"></i>Kids</span><span><i style="background:var(--sage)"></i>Lambs</span><span><i style="background:var(--gold)"></i>Target growth</span></div>':'<div class="legend"><span><i style="background:var(--gold)"></i>Target growth to sale weight</span></div>'}`;
}
function grpStats(list){
  const gs=list.map(a=>({a,g:growth(a)}));const bw=gs.map(x=>x.g.bw).filter(v=>v!=null),r=gs.map(x=>x.g.adgG).filter(v=>v!=null),w=gs.filter(x=>x.g.w100&&!x.g.w100proj).map(x=>x.g.w100.adj);
  const avg=v=>v.length?sum(v)/v.length:null;return {n:list.length,bw:avg(bw),adg:avg(r),w100:avg(w)};
}
VIEWS.young=function(){

const CAL_TYPES=[['birth','Births','heart'],['health','Health','health'],['feed','Feed','feed'],['wean','Weaning','scale'],['event','Shows & auctions','label'],['invoice','Invoices','money'],['rem','Reminders','cal']];
function calItems(from,to){
  return M('cal:'+S.sp+':'+from+':'+to,()=>{
    const out=[],inR=d=>validD(d)&&d>=from&&d<=to;
    const push=o=>{if(inR(o.date))out.push(o)};
    groupPregs(pregs()).forEach(x=>{const p=x.p,s=spOf(p.f),st=birthState(p);
      const who=x.group?`${x.group.length} ${plural(x.group.length,s.F.toLowerCase())} (${tagOf(A(p.m.male))} group)`:nameOf(p.f);
      const go=x.group?{page:'breeding',tab:'groups'}:{page:'animal',id:p.f._id};
      if(st.key==='overdue')push({date:TODAY,type:'birth',lvl:'bad',text:`${s.birth} overdue: ${who}`,sub:`Expected by ${fmtD(p.to)}`,go});
      else{push({date:p.from,type:'birth',lvl:p.dIn<=7?'warn':'',text:`${p.from===p.to?s.birth+' due':s.birth+' window opens'}: ${who}`,sub:p.from===p.to?'':`Window to ${fmtD(p.to)}`,go});
        if(p.from!==p.to)push({date:p.to,type:'birth',lvl:'',text:`${s.birth} window closes: ${who}`,sub:'',go})}
    });
    recsOf('mating').forEach(m=>{const fs=matingFemales(m).filter(id=>inSp(A(id))&&A(id).status==='active');if(!fs.length)return;
      if(recsOf('scan').some(x=>x.mating===m._id))return;const d=addD(validD(m.end)?m.end:m.date,45);if(d<TODAY)return;
      push({date:d,type:'birth',lvl:'',text:`Pregnancy scan possible: ${fs.length===1?nameOf(A(fs[0])):fs.length+' females'}`,sub:`From ${tagOf(A(m.male))} mating`,go:{page:'breeding',tab:'matings'}})});
    healthDue().forEach(x=>{const ids=x.ids.filter(id=>inSp(A(id)));if(!ids.length)return;
      push({date:x.d<0?TODAY:x.h.next,type:'health',lvl:x.d<0?'bad':x.d<=7?'warn':'',text:`${x.h.product||x.h.type}${x.d<0?' (overdue)':''}`,sub:`${ids.length} ${plural(ids.length,'animal')}${x.d<0?' · was due '+fmtD(x.h.next):''}`,go:{page:'health',tab:'due'}})});
    const wd={};Object.entries(withdrawals()).forEach(([id,w])=>{const a=A(id);if(a&&a.status==='active'&&inSp(a))(wd[w.end]=wd[w.end]||[]).push(a)});
    Object.entries(wd).forEach(([d,as])=>push({date:d,type:'health',lvl:'',text:`Withdrawal ends: ${as.length===1?nameOf(as[0]):as.length+' animals'}`,sub:'Clear for slaughter from this day',go:as.length===1?{page:'animal',id:as[0]._id}:{page:'health',tab:'withdrawal'}}));
    if(S.sp==='all')recsOf('feed').forEach(f=>{const dl=feedDaysLeft(f);if(dl==null)return;const d=addD(TODAY,Math.floor(dl));push({date:d,type:'feed',lvl:dl<5?'bad':dl<14?'warn':'',text:`${f.name} runs out`,sub:`${fmtN(feedNow(f))} ${f.unit} left at ${fmtN(f.daily,1)}/day`,go:{page:'feed'}})});
    const wn={};onFarm().filter(a=>inSp(a)&&validD(a.dob)).forEach(a=>{const d=addD(a.dob,spOf(a).wean);if(d>=TODAY&&!weightsOf(a._id).some(w=>/wean/i.test(w.label)))(wn[d]=wn[d]||[]).push(a)});
    Object.entries(wn).forEach(([d,as])=>push({date:d,type:'wean',lvl:'',text:`Weaning age: ${as.length===1?nameOf(as[0]):as.length+' '+(as.every(a=>a.species==='sheep')?'lambs':as.every(a=>a.species==='goat')?'kids':'young')}`,sub:'Weigh for 100-day weights',act:'weighIds',ids:as.map(a=>a._id)}));
    recsOf('event').forEach(e=>{push({date:e.date,type:'event',lvl:'',text:`${e.type}: ${e.name}`,sub:`${(e.animals||[]).length} animals${e.venue?' · '+e.venue:''}`,go:{page:'shows',ev:e._id}});
      if(validD(e.deadline)&&e.deadline>=TODAY)push({date:e.deadline,type:'event',lvl:diffD(TODAY,e.deadline)<=7?'warn':'',text:`Entry deadline: ${e.name}`,sub:'',go:{page:'shows',ev:e._id}})});
    recsOf('invoice').forEach(v=>{if(v.status==='paid'||!validD(v.due))return;const late=v.due<TODAY;push({date:late?TODAY:v.due,type:'invoice',lvl:late?'bad':'',text:`Payment ${late?'overdue':'due'}: ${v.no}`,sub:`${v.buyer&&v.buyer.name||''} · ${money(invTotal(v).total)}`,go:{page:'invoices',inv:v._id}})});
    recsOf('reminder').filter(r=>!r.done&&validD(r.date)).forEach(r=>push({date:r.date<TODAY?TODAY:r.date,type:'rem',lvl:r.date<TODAY?'bad':'',text:r.text,sub:r.date<TODAY?'Was due '+fmtD(r.date):'',rem:r._id}));
    const o={bad:0,warn:1,'':2};
    return out.sort((a,b)=>a.date.localeCompare(b.date)||o[a.lvl]-o[b.lvl]);
  });
}

function readiness(e,a){
  const manual=checkList(e),done=(e.checks||{})[a._id]||{};
  const w=withdrawals()[a._id],wdOk=!w||w.end<=e.date;
  const lk=lastKg(a._id),wOk=!!lk&&diffD(lk.date,e.date)<=21;

  const auto=[['wd','No withdrawal on the day',wdOk],['wt','Weighed within 3 weeks of the day',wOk],['tag','Ear tag recorded',idOk]];
  const items=manual.map(([k,l])=>({k,l,ok:!!done[k],manual:true})).concat(auto.map(([k,l,ok])=>({k,l,ok,manual:false})));
  const n=items.filter(i=>i.ok).length;return {items,n,of:items.length,pct:Math.round(n/items.length*100),blocker:!wdOk};

function showEvent(e){

/* ============ PROJECTIONS ============ */
/* What the farm's own records say: litter size, interval between births, survival to weaning */
function herdRates(k){
  return M('rates:'+k,()=>{
    const s=SP[k],y2=addD(TODAY,-730);
    const bs=recsOf('birth').filter(b=>b.date>=y2&&(A(b.dam)||{}).species===k);
    const born=sum(bs,b=>num(b.born)),alive=sum(bs,b=>num(b.alive));
    const ints=animals().filter(a=>a.species===k&&a.sex==='F').map(a=>kiddingInterval(a._id)).filter(v=>v&&v>s.gest);
    const kids=animals().filter(a=>a.species===k&&a.origin!=='bought'&&validD(a.dob)&&a.dob>=y2&&ageDays(a)>=s.wean);
    const lost=kids.filter(a=>a.status==='dead'&&validD(a.statusDate)&&diffD(a.dob,a.statusDate)<s.wean).length;
    const def={goat:{litter:1.6,interval:300},sheep:{litter:1.4,interval:320}}[k];
    return {
      litter:bs.length>=3?born/bs.length:def.litter,litterSrc:bs.length>=3?'your records':'typical',
      interval:ints.length>=3?sum(ints)/ints.length:def.interval,intervalSrc:ints.length>=3?'your records':'typical',
      survive:(born?alive/born:0.95)*(kids.length>=5?1-lost/kids.length:0.92),surviveSrc:kids.length>=5?'your records':'typical'
    };
  });
}
function projAssump(){
  const p=settings().proj;const live=onFarm().filter(inSp);
  // running cost per head per month from the last 6 months of expenses
  const from=addD(TODAY,-182);const exp=sum(recsOf('txn').filter(t=>t.type==='expense'&&t.date>=from&&txnInSp(t)),t=>num(t.amount));
  const rc=reconcile(from,TODAY,S.sp==='all'?'all':S.sp);const heads=Math.max(1,(rc.open+rc.close)/2);
  const costAuto=exp/heads/6;
  const youngPriceAuto=k=>{const pr=settings().prices[k]||{},t=target(k);return num(pr.perKg)>0?num(pr.perKg)*t.sale:num(pr.young)||num(pr.adult)*0.5||0};
  return {keepF:num(p.keepF),sellAge:num(p.sellAge)||8,adultDeath:num(p.adultDeath),cost:num(p.costHeadMonth)||costAuto,costAuto,costSet:!!num(p.costHeadMonth),
    price:k=>num(p.youngPrice)||youngPriceAuto(k),priceSet:!!num(p.youngPrice),priceAuto:youngPriceAuto};
}
/* 12-month month-by-month simulation */
function projection(){
  return M('proj:'+S.sp,()=>{
    const as=projAssump(),sps=S.sp==='all'?spOn():[S.sp];
    const months=[];const start=parseD(TODAY);for(let i=0;i<12;i++){const d=new Date(start.getFullYear(),start.getMonth()+i+1,0);months.push({end:isoD(d),label:d.toLocaleDateString('en-GB',{month:'short'}),births:0,young:0,sold:0,income:0,cost:0,deaths:0,herd:0})}
    const mi=d=>months.findIndex(m=>d<=m.end);
    let herd0=0,soldYoungN=0,births=0,bornYoung=0;
    const perSp={};
    sps.forEach(k=>{
      const s=SP[k],r=herdRates(k),live=onFarm().filter(a=>a.species===k);herd0+=live.length;
      const sellD=Math.round(as.sellAge*30.4),keep=as.keepF/100,price=as.price(k);
      const ev=[];// [date, delta herd, sold count, income]
      const youngOut=(dob,n,isMale)=>{const sd=addD(dob,sellD);const ns=isMale?n:n*(1-keep);if(ns>0)ev.push({date:sd,herd:-ns,sold:ns,inc:ns*price})};
      // existing young that will be sold within the year
      live.filter(a=>validD(a.dob)&&ageDays(a)<sellD).forEach(a=>{if(a.sex!=='F')youngOut(a.dob,1,true);else if(!labelsOf(a).some(l=>/replacement|keep|stud|breeding/i.test(l)))youngOut(a.dob,1,false)});
      // breeding females: next births then every interval
      const fem=live.filter(a=>a.sex==='F'&&breedingAge(a));
      fem.forEach(f=>{
        const p=pregnancies().find(x=>x.f._id===f._id);const b=birthsOf(f._id);const last=b.length?b[b.length-1].date:null;
        let next=p?(p.from<TODAY?TODAY:p.from):last&&addD(last,r.interval)>TODAY?addD(last,r.interval):addD(TODAY,s.gest+45);
        while(next<=months[11].end){
          const n=r.litter*r.survive;ev.push({date:next,herd:n,births:1,young:n});
          youngOut(next,n/2,true);youngOut(next,n/2,false);
          next=addD(next,r.interval);
        }
      });
      ev.forEach(e=>{const i=mi(e.date);if(i<0)return;const m=months[i];m.births+=e.births||0;m.young+=e.young||0;m.sold+=e.sold||0;m.income+=e.inc||0;m.herdDelta=(m.herdDelta||0)+e.herd});
      perSp[k]={rates:r,price,fem:fem.length};
    });
    let h=herd0;months.forEach(m=>{const dead=h*as.adultDeath/100/12;h=Math.max(0,h+(m.herdDelta||0)-dead);m.deaths=dead;m.herd=h;m.cost=as.cost*h});
    const tot=k=>sum(months,m=>m[k]);
    const vals=onFarm().filter(inSp).map(valueOf).filter(v=>v!=null);const avgVal=vals.length?sum(vals)/vals.length:0;
    return {avgVal,valueGain:(months[11].herd-herd0)*avgVal,months,herd0,herd12:months[11].herd,births:tot('births'),young:tot('young'),sold:tot('sold'),income:tot('income'),cost:tot('cost'),profit:tot('income')-tot('cost'),as,perSp};
  });
}
function projView(){
  const P=projection(),as=P.as,sps=S.sp==='all'?spOn():[S.sp];
  const growth=P.herd0?(P.herd12-P.herd0)/P.herd0*100:0;const loss=P.profit<0;
  const brk=P.sold>0?P.cost/P.sold:null;
  const W=760,H=220,L=44,R=16,T=12,B=28;const vals=[P.herd0,...P.months.map(m=>m.herd)];const ticks=niceTicks(Math.min(...vals)*0.9,Math.max(...vals)*1.05,4);const y0=ticks[0],y1=ticks[ticks.length-1];
  const X=i=>L+i/12*(W-L-R),Y=v=>T+(1-(v-y0)/((y1-y0)||1))*(H-T-B);
  const path=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected herd size">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line-2)"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${fmtN(t)}</text>`).join('')}
  <path d="${path} L${X(12)} ${Y(y0)} L${X(0)} ${Y(y0)} Z" fill="var(--forest-2)" fill-opacity=".07"/><path d="${path}" fill="none" stroke="var(--forest-2)" stroke-width="2.2"/>
  ${vals.map((v,i)=>i%3===0||i===12?`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--surface)" stroke="var(--forest-2)" stroke-width="2"/><text x="${X(i)}" y="${H-8}" text-anchor="middle">${i===0?'Now':P.months[i-1].label}</text>`:'').join('')}
  <circle cx="${X(12)}" cy="${Y(P.herd12)}" r="5.5" fill="var(--gold)" stroke="var(--surface)" stroke-width="2"/><text x="${X(12)-8}" y="${Y(P.herd12)-10}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fmtN(P.herd12)} head</text></svg>`;
  const overall=P.profit+P.valueGain;
  return `<div class="verdict ${loss?'loss':''}"><div><div class="eyebrow">Next 12 months, projected</div><div class="v-big">${loss?'Cash loss of ':'Cash profit of '}${money(Math.abs(P.profit))}</div><div class="v-sub">${money(P.income)} from selling about ${fmtN(P.sold)} young stock, against ${money(P.cost)} in running costs.</div>${P.avgVal?`<div class="v-sub" style="margin-top:8px;opacity:1">Including the value of ${fmtN(P.herd12-P.herd0)} extra animals (${money(P.valueGain)}), the farm ${overall>=0?'gains':'loses'} <b>${money(Math.abs(overall))}</b> overall.</div>`:''}</div>
  <div class="v-side"><div><span>Herd now</span><b>${fmtN(P.herd0)}</b></div><div><span>In 12 months</span><b>${fmtN(P.herd12)}</b></div><div><span>Growth</span><b>${growth>=0?'+':''}${fmtN(growth)}%</b></div></div></div>

function moneyBuckets(per,all){
  const [from,to]=periodRange(per);const out=[];
  if(per==='1w'){for(let i=6;i>=0;i--){const d=addD(TODAY,-i);out.push({label:parseD(d).toLocaleDateString('en-GB',{weekday:'short'}),f:d,t:d})}}
  else if(per==='1m'){for(let i=3;i>=0;i--){const t=addD(TODAY,-i*7),f=addD(t,-6);out.push({label:fmtDs(f),f,t})}}
  else{const n=per==='6m'?6:per==='all'?Math.min(24,Math.max(12,(()=>{const d=all.length?all.slice().sort(byDate)[0].date:TODAY;return diffD(d,TODAY)/30.4+1|0})())):12;
    const end=per==='last'?parseD(to):parseD(TODAY);for(let i=n-1;i>=0;i--){const d=new Date(end.getFullYear(),end.getMonth()-i,1);const f=isoD(d),t=isoD(new Date(d.getFullYear(),d.getMonth()+1,0));out.push({label:d.toLocaleDateString('en-GB',{month:'short'}),f,t})}}
  return out.map(b=>{const m=all.filter(x=>x.date>=b.f&&x.date<=b.t);return {label:b.label,inc:sum(m.filter(x=>x.type==='income'),x=>num(x.amount)),exp:sum(m.filter(x=>x.type==='expense'),x=>num(x.amount))}});
}

const STAGES=[
  ['open','Open','Not mated, ready to breed'],
  ['mated','Mated','Waiting for a scan'],
  ['preg','Pregnant','Confirmed or past scan date'],
  ['due','Due Soon','Within 14 days or overdue'],
  ['young','With Young','Nursing until weaning']
];
function breedStage(f){
  const p=pregnancies().find(x=>x.f._id===f._id);
  if(p){const st=birthState(p);
    if(['overdue','today','open','urgent','attention'].includes(st.key))return {k:'due',p,st};
    const since=diffD(validD(p.m.end)?p.m.end:p.m.date,TODAY);
    if(!p.scan&&since<60)return {k:'mated',p,st,since};
    return {k:'preg',p,st};
  }
  const b=birthsOf(f._id),last=b.length?b[b.length-1]:null;
  if(last&&diffD(last.date,TODAY)<=spOf(f).wean)return {k:'young',last};
  return {k:'open',last};
}
function breedRow(f,x){
  const s=spOf(f),sire=x.p&&A(x.p.m.male);let line='',side='',act='';
  if(x.k==='open'){const d=x.last?diffD(x.last.date,TODAY):null;line=x.last?`Last ${s.birth.toLowerCase()} ${fmtD(x.last.date)} · open ${d} days`:`No ${s.birth.toLowerCase()} recorded yet`;side=`<span class="bstat${d!=null&&d>365?' warn':''}">${d!=null&&d>365?'Long open':'Ready'}</span>`;act=`<button class="btn sm" data-act="mateOne" data-id="${f._id}">Mate</button>`}
  else if(x.k==='mated'){const scanFrom=addD(validD(x.p.m.end)?x.p.m.end:x.p.m.date,45);line=`Mated ${fmtD(x.p.m.date)} to ${sire?esc(tagOf(sire)):'unknown'} · ${esc(x.p.m.method||'')}`;side=`<span class="bstat">${diffD(TODAY,scanFrom)>0?'Scan from '+fmtDs(scanFrom):'Ready to scan'}</span>`;act=`<button class="btn sm ghost" data-act="scanForm" data-id="${x.p.m._id}">Scan</button>`}
  else if(x.k==='preg'){line=`Sire ${sire?esc(tagOf(sire)):'unknown'} · ${x.p.scan?'scanned '+esc(x.p.scan):'not scanned'} · due ${x.p.from===x.p.to?fmtD(x.p.from):fmtDs(x.p.from)+' – '+fmtD(x.p.to)}`;side=countdown(x.p,true);act=`<button class="btn sm ghost" data-act="open" data-id="${f._id}">View</button>`}
  else if(x.k==='due'){line=`Sire ${sire?esc(tagOf(sire)):'unknown'}${x.p.scan?' · scanned '+esc(x.p.scan):''} · ${x.st.key==='overdue'?'expected by '+fmtD(x.p.to):x.p.from===x.p.to?'due '+fmtD(x.p.from):'window '+fmtDs(x.p.from)+' – '+fmtD(x.p.to)}`;side=countdown(x.p,true);act=`<button class="btn sm" data-act="birthForm" data-id="${f._id}">Record ${s.birth}</button>`}
  else{const off=(x.last.offspring||[]).map(A).filter(Boolean);line=`${s.birth} ${fmtD(x.last.date)} · ${x.last.alive} of ${x.last.born} alive · weaning ${fmtDs(addD(x.last.date,s.wean))}`;side=`<span class="bstat">${diffD(x.last.date,TODAY)} days old</span>`;act=off.length?`<button class="btn sm ghost" data-act="weighIds" data-ids="${off.map(o=>o._id).join(',')}">Weigh ${s.youngPl.toLowerCase()}</button>`:''}
  return `<div class="brow2" data-act="open" data-id="${f._id}"><div class="b2main"><div class="row" style="gap:8px">${tagChip(f)}<b>${esc(f.name||'')}</b><span class="muted small">${esc(sexWord(f))} · ${ageText(ageDays(f))}</span></div><div class="small muted b2line">${line}</div></div><div class="b2side">${side}</div><div class="b2act" data-stop="1">${act}</div></div>`;
}
