/* ============ WEIGHT HISTORY & PROJECTIONS (per animal) ============ */
const MILESTONES=[[100,'Weaning (100 days)'],[122,'4 months'],[183,'6 months'],[243,'8 months'],[304,'10 months'],[365,'12 months']];
function wHistory(a){
  const all=weightsOf(a._id);const bw=birthWt(a);let prev=null;
  return all.map(w=>{const r=Object.assign({},w);r.age=validD(a.dob)?diffD(a.dob,w.date):null;
    if(w.kg!=null){if(prev){r.days=diffD(prev.date,w.date);r.gain=w.kg-prev.kg;r.adg=r.days>0?r.gain/r.days*1000:null}
      r.life=r.age>0&&bw!=null?(w.kg-bw)/r.age*1000:null;prev=w}
    return r});
}
function wProjection(a){
  const h=wHistory(a).filter(w=>w.kg!=null);if(!h.length||!validD(a.dob))return null;
  const last=h[h.length-1];const wean=spOf(a).wean;const ints=h.filter(w=>w.adg!=null&&w.days>=5&&(last.age<=wean+30||(w.age-w.days)>=wean-10)).slice(-3).map(w=>Math.max(0,w.adg));
  const recent=ints.length?ints[ints.length-1]:null;const life=last.life;
  const rate=recent!=null?recent:life;if(rate==null)return {last,rate:null};
  const lo=ints.length>1?Math.min(...ints):rate*0.85,hi=ints.length>1?Math.max(...ints):rate*1.15;
  const at=(age,r)=>last.kg+(r/1000)*(age-last.age);
  const t=target(a.species);
  const ms=MILESTONES.concat(MILESTONES.some(m=>Math.abs(m[0]-t.saleAge)<=15)?[]:[[t.saleAge,'Target sale age']]).filter(([d])=>d>last.age).sort((x,y)=>x[0]-y[0]).filter((m,i,arr)=>i===0||arr[i-1][0]!==m[0]);
  let hit=null;if(last.kg>=t.sale)hit={done:true};else if(rate>0){const days=Math.ceil((t.sale-last.kg)/(rate/1000));hit={date:addD(last.date,days),age:last.age+days}}
  return {last,rate,lo,hi,recent,life,ints,at,ms,hit,t};
}
function wChart(a,P){
  const h=wHistory(a).filter(w=>w.kg!=null);if(h.length<1)return '<div class="empty small">No weights yet. Add the first one above.</div>';
  const W=760,H=270,L=44,R=70,T=16,B=30;
  const endAge=P&&P.rate!=null?Math.max(...P.ms.map(m=>m[0]).slice(-1),h[h.length-1].age||0):Math.max(...h.map(w=>w.age||0));
  const x0=Math.min(0,...h.map(w=>w.age||0)),x1=Math.max(endAge,(h[h.length-1].age||0)+30);
  const projMax=P&&P.rate!=null?P.at(x1,P.hi):0;
  const yMax=Math.max(...h.map(w=>w.kg),projMax,P?P.t.sale:0)*1.08;const ticks=niceTicks(0,yMax,4);const top=ticks[ticks.length-1];
  const X=v=>L+(v-x0)/((x1-x0)||1)*(W-L-R),Y=v=>T+(1-v/top)*(H-T-B);
  const pts=h.map(w=>[X(w.age||0),Y(w.kg)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let proj='';
  if(P&&P.rate!=null){const la=P.last.age;const band=`M${X(la)} ${Y(P.last.kg)} L${X(x1)} ${Y(P.at(x1,P.hi))} L${X(x1)} ${Y(P.at(x1,P.lo))} Z`;
    proj=`<path d="${band}" fill="var(--gold)" fill-opacity=".14"/><path d="M${X(la)} ${Y(P.last.kg)} L${X(x1)} ${Y(P.at(x1,P.rate))}" stroke="var(--gold)" stroke-width="2.2" stroke-dasharray="6 5" fill="none"/>
    ${P.ms.map(([d,l])=>d<=x1?`<circle cx="${X(d)}" cy="${Y(P.at(d,P.rate))}" r="4" fill="var(--surface)" stroke="var(--gold)" stroke-width="2"><title>${l}: ${fmtN(P.at(d,P.rate),1)} kg</title></circle>`:'').join('')}
    <text x="${X(x1)+6}" y="${Y(P.at(x1,P.rate))+4}" style="fill:var(--ink);font-weight:700">${fmtN(P.at(x1,P.rate),1)} kg</text>
    <line x1="${L}" x2="${W-R}" y1="${Y(P.t.sale)}" y2="${Y(P.t.sale)}" stroke="var(--forest-2)" stroke-dasharray="2 4"/><text x="${W-R+6}" y="${Y(P.t.sale)+4}" style="fill:var(--forest-2);font-weight:600">Target ${P.t.sale}</text>`}
  const xt=[0,100,183,243,365,Math.round(x1)].filter((v,i,arr)=>v>=x0&&v<=x1&&arr.indexOf(v)===i&&(v===x1||x1-v>25));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight history and projection">
  ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line-2)"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${fmtN(t)}</text>`).join('')}
  ${xt.map(v=>`<text x="${X(v)}" y="${H-8}" text-anchor="middle">${v===0?'Birth':v<730?Math.round(v/30.4)+' mo':Math.round(v/365)+' y'}</text>`).join('')}
  ${proj}<path d="${line}" fill="none" stroke="var(--forest-2)" stroke-width="2.6" stroke-linejoin="round"/>
  ${h.map((w,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="var(--forest-2)" stroke="var(--surface)" stroke-width="1.5"><title>${fmtD(w.date)}: ${fmtN(w.kg,1)} kg</title></circle>`).join('')}
  </svg><div class="legend"><span><i style="background:var(--forest-2)"></i>Weighed</span>${P&&P.rate!=null?'<span><i style="background:var(--gold)"></i>Projected at current gain (shaded = slowest to fastest recent rate)</span>':''}</div>`;
}

const Access={
  plan(){return Billing.effectivePlan()},
  P(){return PLANS[this.plan()]},

  member(){if(this.plan()!=='farm_pro'||S.actAs==='owner')return null;return account().team.find(m=>m.id===S.actAs)||null},
  role(){const m=this.member();return m?m.role:'owner'},
  roleName(){return ROLES[this.role()].name},
  actorName(){const m=this.member();return m?m.name:(account().owner.name||'Owner')},
  actorId(){const m=this.member();return m?m.id:'owner'},
  allowed(perm){const r=ROLES[this.role()];return r.perms.includes(perm)||(perm==='team.manage'&&this.role()==='admin'&&account().adminsManageTeam)},
  animalCount(){return animals().filter(a=>a.status==='active'&&!a.sample).length},
  animalLimit(){return this.P().animalLimit},
  canAddAnimal(n){return this.animalCount()+(n||1)<=this.animalLimit()},

  canInviteUser(){return this.can('team')&&this.allowed('team.manage')},
  canExport(){return this.can('csv')&&this.allowed('export')},

  /* data-layer backstop: every Store.put asks here */

    const need={animal:'animals.edit',weigh:null,birth:'births.add',mating:'breeding.edit',scan:'breeding.edit',health:'health.add',feed:'feed.edit',txn:'finance.edit',invoice:'finance.edit',settings:'settings.edit',reminder:'calendar.edit',event:'events.edit',prep:'events.edit'}[kind];
    if(kind==='weigh'){if(this.allowed('weights.add')||this.allowed('famacha.add'))return true;return this.deny('record weights')}
    if(kind==='animal'&&!this.allowed('animals.edit')){if(S._birthCtx&&this.allowed('births.add'))return true;if(!isNew&&this.allowed('notes.edit')&&S._notesCtx)return true;return this.deny(PERM_NAMES['animals.edit'])}
    if(need&&!this.allowed(need))return this.deny(PERM_NAMES[need]);
    /* plan limit backstop: a new or re-activated animal must fit the plan */
    if(kind==='animal'&&rec&&!rec.sample&&rec.status==='active'){const prev=rec._id&&S.recs.get(rec._id);if((!prev||prev.status!=='active')&&!this.canAddAnimal(1)){toast(`${this.P().name} includes ${this.animalLimit()} active animals. Upgrade to add more.`);return false}}
    return true;
  },
  guardDelete(kind){if(kind==='actlog')return true;const need=kind==='animal'?'animals.delete':{weigh:'weights.add',birth:'births.add',mating:'breeding.edit',scan:'breeding.edit',health:'health.add',feed:'feed.edit',txn:'finance.edit',invoice:'finance.edit',reminder:'calendar.edit',event:'events.edit',prep:'events.edit'}[kind]||'settings.edit';return this.allowed(need)||this.deny(PERM_NAMES[need])},
  deny(what){toast(`As ${this.roleName()} you can't ${what}. Ask the farm owner.`);return false}
};

/* ---------- ACTIVITY LOG ---------- */
const Activity={
  log(text,animalIds){
    const id='act-'+TODAY.slice(0,7);const doc=S.recs.get(id)||{kind:'actlog',_id:id,month:TODAY.slice(0,7),entries:[]};
    const e={t:new Date().toISOString(),who:Access.actorId(),name:Access.actorName(),role:Access.role(),text,animals:(animalIds||[]).slice(0,20)};
    const entries=(doc.entries||[]).concat([e]).slice(-800);
    Store.put(Object.assign({},doc,{entries}),{system:true,nolog:true});
  },
  onWrite(r,isNew,before){
    if(['actlog','account'].includes(r.kind)||r.sample)return;
    const T=id=>tagOf(A(id)),n=x=>x.length;let t=null,ids=[];
    switch(r.kind){
      case 'animal':ids=[r._id];if(isNew)t=`added ${r.tag}`;else if(before&&before.status!==r.status)t=`marked ${r.tag} as ${(STATUSES[r.status]||r.status).toLowerCase()}`;else if(before&&JSON.stringify(before.labels||[])!==JSON.stringify(r.labels||[]))t=`changed labels on ${r.tag}`;else if(before&&before.photo!==r.photo)t=`added a photo of ${r.tag}`;else t=`updated ${r.tag}`;break;
      case 'weigh':{const es=Object.entries(r.entries||{}),pe=before?before.entries||{}:{};const ch=es.filter(([id,e])=>JSON.stringify(pe[id]||null)!==JSON.stringify(e));ids=ch.map(x=>x[0]);if(!ch.length)return;
        const kg=ch.filter(([,e])=>e.kg!=null).length,fm=ch.filter(([,e])=>e.fam!=null).length;
        t=ch.length===1?(kg?`weighed ${T(ch[0][0])} at ${fmtN(ch[0][1].kg,1)} kg`:'')+(fm?`${kg?' and ':''}scored FAMACHA ${ch[0][1].fam} for ${T(ch[0][0])}`:''):`${kg?'weighed '+kg+' animals':''}${kg&&fm?', ':''}${fm?'scored FAMACHA for '+fm+' animals':''}`;break}
      case 'birth':ids=[r.dam].concat(r.offspring||[]);t=isNew?`recorded a ${spOf(A(r.dam)).birth.toLowerCase()} for ${T(r.dam)}: ${r.born} born, ${r.alive} alive`:`updated the birth record of ${T(r.dam)}`;break;
      case 'mating':ids=(r.females||[]).concat([r.male]);t=`${isNew?'recorded':'updated'} a mating: ${T(r.male)} with ${n(r.females||[])} ${plural(n(r.females||[]),'female')}`;break;
      case 'scan':t='recorded pregnancy scan results';break;
      case 'health':ids=r.animals||[];t=`${isNew?'recorded':'updated'} ${r.type.toLowerCase()}${r.product?' ('+r.product+')':''} for ${n(ids)===1?T(ids[0]):n(ids)+' animals'}`;break;
      case 'feed':t=`updated feed: ${r.name}`;break;
      case 'txn':t=`${isNew?'added':'updated'} ${r.type}: ${r.desc||r.category} (${money(num(r.amount))})`;ids=r.animals||[];break;
      case 'invoice':t=`${isNew?'created':'updated'} invoice ${r.no}${r.status==='paid'&&before&&before.status!=='paid'?' (marked paid)':''}`;ids=(r.lines||[]).map(l=>l.animal).filter(Boolean);break;
      case 'event':t=`${isNew?'created':'updated'} ${r.type.toLowerCase()} “${r.name}”`;break;
      case 'prep':t=`logged ${String(r.cat).toLowerCase()} for ${(evById(r.event)||{}).name||'an event'}`;ids=r.animals||[];break;
      case 'reminder':t=isNew?`added a reminder: ${r.text}`:r.done?`completed a reminder: ${r.text}`:'updated a reminder';break;
      case 'settings':t='changed farm settings';break;
      default:return;
    }
    if(t)this.log(t,ids.filter(Boolean));
  },
  onDelete(r){if(['actlog','account'].includes(r.kind)||r.sample)return;const what={animal:'animal '+r.tag,weigh:'a weighing',birth:'a birth record',mating:'a mating record',health:'a health record',txn:'a '+r.type,invoice:'invoice '+r.no,event:r.name,prep:'a preparation entry',reminder:'a reminder',feed:'feed '+r.name}[r.kind]||'a record';this.log('deleted '+what,r.kind==='animal'?[r._id]:[])},
  all(){return recsOf('actlog').flatMap(d=>d.entries||[]).sort((a,b)=>b.t.localeCompare(a.t))}
};

};
function actAllowed(name,d){
  const r=ACT_RULES[name];if(!r)return true;
  if(name==='animalForm'&&d&&d.id){if(!Access.allowed('animals.edit')){Access.deny(PERM_NAMES['animals.edit']);return false}return true}
  if(r.f&&!Access.can(r.f)){upgradeSheet(r.f);return false}

  if(name==='animalForm'&&!Access.canAddAnimal(1)){limitSheet(1);return false}
  return true;
}

  const born=sum(yr,b=>num(b.born)),alive=sum(yr,b=>num(b.alive));const multi=yr.filter(b=>num(b.born)>1).length;const assisted=yr.filter(b=>b.ease&&!/unassisted|slight/i.test(b.ease)).length;
  const P=pregs().filter(p=>p.dEnd>=0&&p.dIn<=30);

  <div class="kpis">${kpi('Births, 12 months',yr.length)}${kpi('Young born',born,`${alive} born alive`)}${kpi('Born alive',born?Math.round(alive/born*100)+'%':'—')}${kpi('Twins or more',yr.length?Math.round(multi/yr.length*100)+'%':'—','of births')}${kpi('Assisted',yr.length?Math.round(assisted/yr.length*100)+'%':'—',null,assisted?'warn':'')}${kpi('Due in 30 days',P.length,null,null,{page:'breeding',stage:'due'})}</div>
  <div class="sec"><div class="sec-h"><h2>Birth Records</h2><span class="muted small">${bs.length} recorded</span></div>

};

/* ---------- FAMACHA ---------- */
VIEWS.famacha=function(){
  const live=onFarm().filter(inSp);const fb=famBuckets(live);const scored=[...fb.poor,...fb.mid,...fb.good];
  const dist=[1,2,3,4,5].map(g=>scored.filter(x=>x.f.g===g).length);const tot=sum(dist);
  const recent=recsOf('weigh').filter(w=>Object.entries(w.entries||{}).some(([id,e])=>e&&e.fam!=null&&inSp(A(id)))).sort(byDate).reverse().slice(0,6);
  let analytics='';
  if(Access.can('famachaAnalytics')){
    const fm=[];const end=parseD(TODAY);for(let i=5;i>=0;i--){const d=new Date(end.getFullYear(),end.getMonth()-i,1),k=isoD(d).slice(0,7);const c=[0,0,0,0,0,0];recsOf('weigh').filter(w=>(w.date||'').startsWith(k)).forEach(w=>Object.entries(w.entries||{}).forEach(([id,e])=>{if(e&&e.fam!=null&&inSp(A(id)))c[famGrade(e.fam)]++}));fm.push({label:d.toLocaleDateString('en-GB',{month:'short'}),c,n:sum(c)})}
    const repeat=live.map(a=>({a,n:famHigh(a._id)})).filter(x=>x.n>=2).sort((x,y)=>y.n-x.n);
    analytics=`<div class="split mt"><div class="card"><div class="card-h"><div><h2>Herd Spread</h2><div class="sub">Latest score per animal, last 90 days</div></div></div>
      <div class="fdist">${[1,2,3,4,5].map(g=>`<div class="fd"><div class="fd-bar"><span style="height:${tot?dist[g-1]/Math.max(...dist)*100:0}%;background:${FAM_EYE[g].c}"></span></div><b>${dist[g-1]}</b><em>${g} · ${FAM_EYE[g].s}</em></div>`).join('')}</div></div>
      <div class="card"><div class="card-h"><div><h2>Pale Scores by Month</h2><div class="sub">Share of checks scoring 1 or 2</div></div></div>${fm.some(m=>m.n)?`<div class="stack" style="gap:8px">${fm.map(m=>`<div class="row" style="gap:10px;flex-wrap:nowrap"><span class="small muted" style="width:34px">${m.label}</span><div class="meter" style="flex:1;height:10px"><span style="width:${m.n?(m.c[1]+m.c[2])/m.n*100:0}%;background:var(--bad)"></span></div><span class="small tnum" style="width:92px;text-align:right">${m.n?Math.round((m.c[1]+m.c[2])/m.n*100)+'% of '+m.n:'no checks'}</span></div>`).join('')}</div>`:empty('No checks in 6 months')}
      ${repeat.length?`<h3 style="margin:16px 0 6px">Repeatedly pale</h3><p class="small muted" style="margin:0 0 6px">Worm resistance is heritable. These are culling candidates.</p><div class="row" style="gap:6px">${repeat.slice(0,10).map(x=>`<button class="btn sm ghost" data-act="open" data-id="${x.a._id}">${esc(tagOf(x.a))} <span class="muted">${x.n}×</span></button>`).join('')}</div>`:''}</div></div>`;
  }else analytics=`<div class="upsell mt"><div><b>FAMACHA Analytics</b><span>See your herd's score spread, monthly worm pressure and animals that keep scoring pale.</span></div><button class="btn sm gold" data-act="upgrade" data-v="pro">Upgrade to Pro</button></div>`;
  return `<div class="pagehead"><div><h1>FAMACHA</h1><div class="sub">Eyelid colour checks for anaemia from wireworm</div></div><button class="btn" data-act="famCheck">${icon('eye')}FAMACHA Check</button></div>
  <div class="card"><div class="card-h"><h2>Score Card</h2><span class="muted small">1 = white eyelid (bad) · 5 = deep red (good)</span></div>${famLegend()}</div>
  <div class="kpis mt">${kpi('Treat now',fb.poor.length,'score 1 or 2',fb.poor.length?'bad':'')}${kpi('Watch',fb.mid.length,'score 3')}${kpi('Healthy',fb.good.length,'score 4 or 5')}${kpi('Not checked',fb.none.length,'in 90 days',fb.none.length?'warn':'',fb.none.length?null:null)}</div>
  ${analytics}
  <div class="split mt"><div class="card"><div class="card-h"><h2>Animals by Latest Score</h2><span class="muted small">most anaemic first</span></div>${scored.length?`<div class="alerts">${scored.slice(0,40).map(({a,f})=>`<div class="al ${f.g<=1?'bad':f.g===2?'warn':'info'}" data-act="open" data-id="${a._id}" style="cursor:pointer"><span class="bar"></span><div><b>${esc(nameOf(a))}</b><div class="d">${fmtD(f.date)}</div></div>${famChip(f.score)}</div>`).join('')}</div>`:empty('No scores yet')}
    ${fb.none.length?`<div class="row mt"><span class="small muted">${fb.none.length} not checked in 90 days</span><button class="btn sm ghost" data-act="famCheck" data-ids="${fb.none.map(a=>a._id).join(',')}" style="margin-left:auto">Check Them Now</button></div>`:''}</div>
  <div class="card"><div class="card-h"><h2>Recent Checks</h2></div>${recent.length?`<div class="alerts">${recent.map(w=>{const es=Object.entries(w.entries||{}).filter(([id,e])=>e&&e.fam!=null&&inSp(A(id)));const pale=es.filter(([,e])=>famGrade(e.fam)<=2).length;return `<div class="al info"><span class="bar"></span><div><b>${es.length} ${plural(es.length,'animal')} checked</b><div class="d">${fmtD(w.date)} · ${esc(w.label||'')}${pale?` · <span style="color:var(--bad)">${pale} pale</span>`:''}</div></div><button class="btn sm ghost" data-act="weighEdit" data-id="${w._id}">Edit</button></div>`}).join('')}</div>`:empty('No checks yet','','<button class="btn" data-act="famCheck">FAMACHA Check</button>')}</div></div>`;
};

/* ---------- WEIGHTS ---------- */
VIEWS.weights=function(){
  if(S.view.pre&&!S.view.opened){S.view.opened=true;setTimeout(()=>openWeigh(S.view.pre),0)}
  const ss=recsOf('weigh').filter(w=>Object.entries(w.entries||{}).some(([id,e])=>e&&e.kg!=null&&inSp(A(id)))).sort(byDate).reverse();
  const m30=ss.filter(w=>w.date>=addD(TODAY,-29));const weighed=new Set();m30.forEach(w=>Object.keys(w.entries).forEach(id=>weighed.add(id)));
  const young=onFarm().filter(a=>inSp(a)&&classGroup(a)!=='adult'&&kgsOf(a._id).length>=2).map(a=>({a,g:adg(a._id)})).filter(x=>x.g!=null).sort((x,y)=>y.g-x.g);

  const s=settings();const pre=(s.tagPrefix||{goat:'G',sheep:'S'}[sp]||'A');const yy=TODAY.slice(2,4);const base=`${pre}-${yy}-`;

function saveAnimal(f,o){
  const id=f.dataset.id;const old=A(id)||{};
  if(!id&&o.status==='active'&&!Access.canAddAnimal(1)){limitSheet(1);return}
  if(id&&old.status!=='active'&&o.status==='active'&&!Access.canAddAnimal(1)){limitSheet(1);return}
  const tag=(o.tag||'').trim();if(!tag){toast('Give the animal a tag or ID');return}
  const dup=animals().find(x=>x._id!==id&&x.status!=='ref'&&(x.tag||'').toLowerCase()===tag.toLowerCase()&&x.species===o.species);
  if(dup&&o.status!=='ref'){toast(`Tag ${tag} is already used by another ${SP[o.species].one.toLowerCase()}`);return}
  if(o.sire&&o.sire===o.dam){toast('Sire and dam must be different animals');return}

  if(!a.created)a.created=TODAY;
  if(a.status!=='active'&&a.status!=='ref'&&!a.statusDate)a.statusDate=TODAY;
  if(a.status==='active'){delete a.statusDate}
  if(!id&&a.origin==='bought'&&num(a.purchasePrice)>0){Store.put({kind:'txn',date:a.purchaseDate||TODAY,type:'expense',category:'Breeding stock purchase',amount:num(a.purchasePrice),desc:`Bought ${a.tag}${a.seller?' from '+a.seller:''}`,animals:[]})}
  const r=Store.put(a);closeSheet();toast(id?'Saved':'Animal added');
  if(!id)go('animal',{id:r._id});else render();
}

function birthSireOpts(dam,date){
  const males=animals().filter(a=>a.sex==='M'&&(a.status==='active'||a.status==='ref'||a.status==='sold'||a.status==='dead')&&(!dam||a.species===dam.species));
  let sug='';if(dam){const p=pregnancies().find(x=>x.f._id===dam._id);if(p)sug=p.m.male;else{const ms=recsOf('mating').filter(m=>matingFemales(m).includes(dam._id)).sort(byDate).pop();if(ms)sug=ms.male}}
  return animalOpts(males,sug,'Unknown');
}
function offRows(dam,n){
  const sp=dam?dam.species:'goat';const nt=nextTag(sp);n=Math.max(1,Math.min(20,n||1));
  const keep=S.bdraft.rows||[];
  let h=`<div class="eyebrow" style="margin:4px 0 8px">${esc(SP[sp].youngPl)}</div><div class="stack" style="gap:8px">`;
  for(let i=0;i<n;i++){const k=keep[i]||{};h+=`<div class="offrow">
    ${fld('Tag',`<input name="o_tag_${i}" value="${esc(k.tag||nt(i+1))}">`)}
    ${fld('Sex',`<select name="o_sex_${i}">${opts([['F','Female'],['M','Male']],k.sex||'F')}</select>`)}
    ${fld('Birth wt (kg)',`<input name="o_kg_${i}" type="number" step="0.01" inputmode="decimal" value="${esc(k.kg||'')}">`)}
    ${fld('Outcome',`<select name="o_alive_${i}">${opts([['1','Alive'],['0','Stillborn / died at birth']],k.alive||'1')}</select>`)}
    ${fld('Name',`<input name="o_name_${i}" value="${esc(k.name||'')}">`)}
  </div>`}
  return h+'</div>';
}
function saveBirth(f,o){
  const dam=A(o.dam);if(!dam){toast('Choose the mother');return}
  const n=Math.max(1,Math.min(20,parseInt(o.born)||1));const s=settings();
  let nAlive=0;for(let i=0;i<n;i++)if(o['o_alive_'+i]!=='0')nAlive++;
  if(!Access.canAddAnimal(nAlive)){limitSheet(nAlive);return}
  const offs=[],entries={};let alive=0;
  S._birthCtx=true;try{
  for(let i=0;i<n;i++){
    const isAlive=o['o_alive_'+i]!=='0';const kg=numOrNull(o['o_kg_'+i]);
    if(!isAlive)continue;alive++;
    const tag=(o['o_tag_'+i]||'').trim()||nextTag(dam.species)(i+1);
    const sire=A(o.sire);
    const reg=(dam.regType||'').startsWith('Stud')&&sire&&(sire.regType||'').startsWith('Stud')?dam.regType:'';
    const a=Store.put({kind:'animal',tag,name:(o['o_name_'+i]||'').trim(),species:dam.species,breed:sire&&sire.breed&&sire.breed!==dam.breed?`${sire.breed} × ${dam.breed}`:(dam.breed||''),sex:o['o_sex_'+i]||'F',dob:o.date,birthType:String(Math.min(n,4)),camp:dam.camp||'',sire:o.sire||'',dam:dam._id,regType:reg,status:'active',origin:'born',created:TODAY,notes:''});
    offs.push(a._id);if(kg!=null)entries[a._id]={kg};
  }
  if(Object.keys(entries).length)Store.put({kind:'weigh',date:o.date,label:'Birth',entries});
  Store.put({kind:'birth',dam:dam._id,sire:o.sire||'',date:o.date,born:n,alive,ease:o.ease,mothering:o.mothering||'',offspring:offs,notes:o.notes||''});
  }finally{S._birthCtx=false}
  S.bdraft=null;closeSheet();toast(`${spOf(dam).birth} recorded: ${alive} alive of ${n}`);render();
}

function collectW(){document.querySelectorAll('#sheet [data-w]').forEach(el=>{const id=el.dataset.w,k=el.dataset.k;const v=el.value;S.wd.vals[id]=S.wd.vals[id]||{};if(v==='')delete S.wd.vals[id][k];else S.wd.vals[id][k]=k==='kg'?num(v):num(v)})}
function saveWeigh(f,o){

function parseCSV(t){
  const rows=[];let r=[],c='',q=false;t=t.replace(/\r\n?/g,'\n');
  const delim=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':(t.split('\n')[0].includes('\t')?'\t':',');
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===delim){r.push(c);c=''}else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()!==''));
}
const CSV_MAP={tag:['tag','ear tag','id','tag no','tag number','eartag','animal id','nommer','oormerk'],name:['name','naam'],species:['species','type','soort'],breed:['breed','ras'],sex:['sex','gender','geslag'],dob:['dob','date of birth','birth date','birthdate','born','geboortedatum'],sire:['sire','father','sire tag','vaar'],dam:['dam','mother','dam tag','moer','ooi'],studNo:['studbook','reg no','registration','stud no','studbook no','registration number'],camp:['camp','paddock','kamp'],colour:['colour','color','kleur'],officialId:['official id','baits','lits','namlits','brand'],rfid:['rfid','microchip','eid'],notes:['notes','comments','notas'],weight:['weight','kg','massa','gewig']};

    ${fld('CSV file',`<input type="file" accept=".csv,text/csv,.txt" data-input="csvFile">`)}
    ${fld('…or paste rows',`<textarea name="text" id="csvText" placeholder="tag,name,sex,dob,sire,dam" style="min-height:120px;font-family:var(--f-mono);font-size:12.5px"></textarea>`,'full')}

function toIsoDate(v){v=(v||'').trim();if(!v)return '';if(/^\d{4}-\d{1,2}-\d{1,2}/.test(v)){const [y,m,d]=v.split(/[-T ]/);return `${y}-${pad(+m)}-${pad(+d)}`}const m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${pad(+m[2])}-${pad(+m[1])}`}const d=new Date(v);return isNaN(d)?'':isoD(d)}
async function importCsv(text,defSp){
  const rows=parseCSV(text);if(rows.length<2){toast('No data rows found');return}
  const head=rows[0].map(h=>h.trim().toLowerCase());const col={};
  Object.entries(CSV_MAP).forEach(([k,names])=>{const i=head.findIndex(h=>names.includes(h));if(i>=0)col[k]=i});
  if(col.tag==null){toast('Could not find a tag column. Name the first column "tag".');return}
  const g=(r,k)=>col[k]!=null?(r[col[k]]||'').trim():'';
  const spMap=v=>{v=v.toLowerCase();return /sheep|skaap|ewe|ram|lamb/.test(v)?'sheep':/goat|bok/.test(v)?'goat':defSp};
  const sexMap=v=>{v=v.toLowerCase();return /^(m|male|ram|buck|bok|ram)$/.test(v)||/male|buck|ram/.test(v)&&!/female/.test(v)?'M':/wether|castr|hamel|barrow/.test(v)?'C':'F'};
  const byTag=new Map(animals().map(a=>[(a.tag||'').toLowerCase(),a]));
  const created=[],weights={};
  rows.slice(1).forEach(r=>{const tag=g(r,'tag');if(!tag)return;if(byTag.has(tag.toLowerCase()))return;
    const a={_id:uid('a'),kind:'animal',tag,name:g(r,'name'),species:col.species!=null?spMap(g(r,'species')):defSp,breed:g(r,'breed'),sex:sexMap(g(r,'sex')),dob:toIsoDate(g(r,'dob')),studNo:g(r,'studNo'),camp:g(r,'camp'),colour:g(r,'colour'),officialId:g(r,'officialId'),rfid:g(r,'rfid'),notes:g(r,'notes'),status:'active',origin:'born',created:TODAY,_sire:g(r,'sire'),_dam:g(r,'dam')};
    created.push(a);byTag.set(tag.toLowerCase(),a);const w=numOrNull(g(r,'weight'));if(w!=null)weights[a._id]={kg:w}});
  created.forEach(a=>{const s=byTag.get((a._sire||'').toLowerCase()),d=byTag.get((a._dam||'').toLowerCase());if(s)a.sire=s._id;else if(a._sire)a.sireExt=a._sire;if(d)a.dam=d._id;else if(a._dam)a.damExt=a._dam;delete a._sire;delete a._dam});
  if(!created.length){toast('Nothing new to import (all tags already exist)');return}
  if(!Access.canAddAnimal(created.filter(a=>a.status==='active').length)){closeSheet();limitSheet(created.length);return}
  const recs=[...created];if(Object.keys(weights).length)recs.push({kind:'weigh',date:TODAY,label:'Imported',entries:weights});
  const s=settings();if(!s.setup)recs.push(Object.assign({},s,{_id:'settings',setup:true}));
  closeSheet();toast(`Importing ${created.length} animals…`);
  await Store.bulk(recs);toast(`Imported ${created.length} animals`);go('herd');
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(e.target.closest('input[type=checkbox]')&&el.dataset.act!=='sel'&&el.dataset.act!=='selAll'&&e.target!==el)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.tagName==='BUTTON')e.preventDefault();
  if(!actAllowed(el.dataset.act,el.dataset)){if(el.matches('input[type=checkbox]'))el.checked=!el.checked;return}
  fn(el.dataset,el,e);
});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#overlay').hidden)closeSheet();
  if(e.key==='Enter'&&e.target.matches('[data-w][data-k=kg]')){e.preventDefault();const i=+e.target.dataset.idx;const n=document.querySelector(`[data-w][data-k=kg][data-idx="${i+1}"]`);if(n){n.focus();n.select()}}
});
let qT;
function invSync(){const f=document.getElementById('invForm');if(!f||!S.invDraft)return;f.querySelectorAll('[data-input=invPrice]').forEach(i=>S.invDraft.prices[i.dataset.id]=i.value);const ids=[...f.querySelectorAll('input[name=animals]:checked')].map(i=>i.value);$('#invPrices').innerHTML=invPriceRows(ids)}
document.addEventListener('change',e=>{if(e.target.matches('#invForm input[name=animals]'))invSync()});
const INP={
  herdq:el=>{S.f.q=el.value;clearTimeout(qT);qT=setTimeout(rerenderKeep,180)},
  filt:el=>{S.f[el.dataset.k]=el.value;S.sel.clear();render()},
  tfilt:el=>{S.tf[el.dataset.k]=el.value;render()},
  tagq:el=>{S.tf.q=el.value;clearTimeout(qT);qT=setTimeout(rerenderKeep,180)},
  studFocus:el=>{S.view.focus=el.value;render()},
  planF:el=>{S.view.planF=el.value;S.view.planM='';render()},
  planM:el=>{S.view.planM=el.value;S.view.planF='';render()},
  calc:el=>{S.calc[el.dataset.k]=el.value;if(el.dataset.k==='sp')S.calc.dress='';el.id=el.id||'calc-'+el.dataset.k;if(el.tagName==='SELECT')render();else{clearTimeout(qT);qT=setTimeout(rerenderKeep,250)}},
  country:el=>{const c=COUNTRIES[el.value];const cu=document.getElementById('f-currency');if(c&&cu)cu.value=c.cur},
  pickfilter:el=>{const q=el.value.toLowerCase();el.parentNode.querySelectorAll('.pick').forEach(p=>p.hidden=!!q&&!p.dataset.q.includes(q))},
  yfSort:el=>{S.yf.sort=el.value;render()},
  invPrice:el=>{S.invDraft.prices[el.dataset.id]=el.value},
  buyerPick:el=>{const b=recsOf('invoice').map(v=>v.buyer).find(b=>b&&b.name===el.value);if(!b)return;const f=el.form;['phone','address','email','vat'].forEach(k=>{const i=f.querySelector('[name=b_'+k+']');if(i&&!i.value)i.value=b[k]||''})},
  spChange:el=>{const d=$('#breedDL');if(d)d.innerHTML=breedList(el.value)},
  photo:el=>{const f=el.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const m=360,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',0.78);URL.revokeObjectURL(u);const a=A(el.dataset.id);if(a){Store.put(Object.assign({},a,{photo:data}));render();toast('Photo saved')}};img.onerror=()=>toast('That image could not be read');img.src=u},
  wgroup:el=>{collectW();S.wd[el.dataset.k]=el.value;drawWeigh()},
  wmeta:el=>{S.wd[el.dataset.k]=el.value},
  bornN:el=>{saveOffDraft();S.bdraft.n=parseInt(el.value)||1;$('#offRows').innerHTML=offRows(A($('#birthForm [name=dam]').value),S.bdraft.n)},
  bDam:el=>{saveOffDraft();S.bdraft.rows=[];const dam=A($('#birthForm [name=dam]').value);$('#bSire').innerHTML=birthSireOpts(dam,$('#birthForm [name=date]').value);$('#offRows').innerHTML=offRows(dam,S.bdraft.n)},
  txnType:el=>{$('#f-cat').innerHTML=opts(TXN_CATS[el.value])},
  csvFile:el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#csvText').value=r.result};r.readAsText(f)}
};
function saveOffDraft(){if(!S.bdraft)return;const f=$('#birthForm');if(!f)return;const o=formData(f);S.bdraft.rows=[];for(let i=0;i<20;i++){if(!('o_tag_'+i in o))break;S.bdraft.rows.push({tag:o['o_tag_'+i],sex:o['o_sex_'+i],kg:o['o_kg_'+i],alive:o['o_alive_'+i],name:o['o_name_'+i]})}}
function onInput(e){const el=e.target.closest('[data-input]');if(!el)return;const k=el.dataset.input;
  const isText=el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['checkbox','radio','file','date'].includes(el.type));
  if(e.type==='input'&&!isText)return; if(e.type==='change'&&isText&&k!=='herdq')return;
  INP[k]&&INP[k](el,e)}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);

const FORMS={
  setup:(f,o)=>{const sp=arr(o.species);if(!sp.length){toast('Choose at least one species');return}saveSettings({farmName:(o.farmName||'').trim(),country:o.country,currency:(o.currency||'').trim()||COUNTRIES[o.country].cur,species:sp,camps:(o.camps||'').split('\n').map(x=>x.trim()).filter(Boolean),setup:true});S.f.sp='all';if(o.plan&&o.plan!=='free')Billing.startTrial(o.plan);if(o.ownerName)saveAccount({owner:Object.assign({},account().owner,{name:o.ownerName.trim()})});saveAccount({farms:[{id:'main',name:(o.farmName||'').trim()}]});go('home');toast('Farm set up. Add your first animals.')},
  labels:saveLabels,
  labelList:(f,o)=>{saveSettings({labels:[...new Set((o.labels||'').split('\n').map(x=>x.trim()).filter(Boolean))]});closeSheet();toast('Label list saved');render()},
  settings:(f,o)=>{const sp=arr(o.species);if(!sp.length){toast('Choose at least one species');return}const prices={};Object.keys(SP).forEach(k=>prices[k]={perKg:num(o[`p_${k}_perKg`]),young:num(o[`p_${k}_young`]),adult:num(o[`p_${k}_adult`])});saveSettings({farmName:(o.farmName||'').trim(),country:o.country,currency:(o.currency||'').trim()||COUNTRIES[o.country].cur,tagPrefix:(o.tagPrefix||'').trim(),famScale:o.famScale==='reversed'?'reversed':'official',labels:[...new Set((o.labels||'').split('\n').map(x=>x.trim()).filter(Boolean))],species:sp,camps:(o.camps||'').split('\n').map(x=>x.trim()).filter(Boolean),prices,setup:true});toast('Settings saved');render()},
  animal:saveAnimal,remove:saveRemove,
  move:(f,o)=>{f.dataset.ids.split(',').map(A).filter(Boolean).forEach(a=>Store.put(Object.assign({},a,{camp:o.camp})));S.sel.clear();closeSheet();toast('Moved to '+o.camp);render()},
  mating:saveMating,
  scan:(f,o)=>{const res={};Object.keys(o).forEach(k=>{if(k.startsWith('r_')&&o[k])res[k.slice(2)]=o[k]});const old=recsOf('scan').find(x=>x._id===f.dataset.id)||{};Store.put(Object.assign({},old,{kind:'scan',mating:f.dataset.mid,date:o.date,results:res}));closeSheet();toast('Scan results saved');render()},
  birth:saveBirth,weigh:saveWeigh,health:saveHealth,

  stock:(f,o)=>{const fd=recsOf('feed').find(x=>x._id===f.dataset.id);if(!fd)return;const q=num(o.qty),c=num(o.cost);if(q<=0){toast('Enter the quantity bought');return}Store.put(Object.assign({},fd,{qty:feedNow(fd)+q,asOf:TODAY,unitCost:c>0?c/q:fd.unitCost}));if(c>0)Store.put({kind:'txn',date:o.date||TODAY,type:'expense',category:'Feed',amount:c,desc:`${fmtN(q)} ${fd.unit} ${fd.name}${o.supplier?', '+o.supplier:''}`});closeSheet();toast('Stock added');render()},
  txn:(f,o)=>{const id=f.dataset.id;const old=recsOf('txn').find(x=>x._id===id)||{};Store.put(Object.assign({},old,{kind:'txn',date:o.date,type:o.type,category:o.category,amount:num(o.amount),desc:o.desc||'',species:o.species||''}));closeSheet();toast('Saved');render()},
  rem:(f,o)=>{Store.put({kind:'reminder',date:o.date,text:o.text.trim(),done:false});closeSheet();toast('Reminder added');render()},
  csv:(f,o)=>{const t=$('#csvText').value;if(!t.trim()){toast('Choose a file or paste rows');return}importCsv(t,o.sp)}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f,formData(f))});

/* global search */
(function(){
  const q=$('#gq');
  q.addEventListener('input',()=>{gIdx=0;drawSearch()});
  q.addEventListener('focus',()=>{if(q.value.trim())drawSearch()});
  q.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();gIdx=Math.min(gIdx+1,gHits.length-1);drawSearch()}
    else if(e.key==='ArrowUp'){e.preventDefault();gIdx=Math.max(0,gIdx-1);drawSearch()}
    else if(e.key==='Enter'){e.preventDefault();const a=gHits[gIdx];if(a)ACT.gopen({id:a._id})}
    else if(e.key==='Escape'){q.value='';hideSearch();q.blur()}
  });
  document.addEventListener('click',e=>{if(!e.target.closest('#gsearch'))hideSearch()});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.target.closest('input,textarea,select')&&$('#overlay').hidden){e.preventDefault();q.focus()}});
})();

Object.assign(FORMS,SHOW_FORMS,INV_FORMS,V2_FORMS,W_FORMS,SAAS_FORMS);Object.assign(ACT,SAAS_ACT);Object.assign(INP,SAAS_INP);

/* ============ BOOT ============ */
(function(){
  const h=(location.hash||'').slice(1);
  if(PAGES.some(p=>p[0]===h))S.view={page:h};
  renderNav();
  Store.init();
  // keep "today" fresh if the page stays open past midnight
  setInterval(()=>{const t=isoD(new Date());if(t!==TODAY){bump();render()}},60000);
})();
